<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Seek harness</title>
  </head>
  <body>
    <!-- Plays conversion.mkv directly and as an HLS stream, and reads the frame index that each shows. -->
    <video id="direct" muted preload="auto"></video>
    <video id="converted" muted preload="auto"></video>
    <canvas id="canvas" width="128" height="72"></canvas>
    <script src="hls.js"></script>
    <script>
      /** Plays the source file in the direct video from a blob URL, as the web app plays a picked file. */
      window.attachDirect = async () => {
        const video = document.getElementById("direct");
        const loaded = new Promise((resolve) =>
          video.addEventListener("loadeddata", resolve, { once: true }),
        );
        const source = await (await fetch("source.mkv")).blob();
        video.src = URL.createObjectURL(source);
        await loaded;
      };

      /** Streams the playlist into the converted video, sending the token with every request. */
      window.attachConverted = (playlistUrl, token) =>
        new Promise((resolve, reject) => {
          const hls = new Hls({
            xhrSetup: (xhr) =>
              xhr.setRequestHeader("Authorization", `Bearer ${token}`),
          });
          hls.on(Hls.Events.ERROR, (_, data) => {
            if (data.fatal) reject(new Error(data.details));
          });
          hls.on(Hls.Events.MANIFEST_PARSED, () => resolve());
          hls.loadSource(playlistUrl);
          hls.attachMedia(document.getElementById("converted"));
        });

      /** Seeks a video and returns the index that the frame it then shows encodes. */
      window.frameShownAt = async (videoId, seconds) => {
        const video = document.getElementById(videoId);
        const seeked = new Promise((resolve) =>
          video.addEventListener("seeked", resolve, { once: true }),
        );
        video.currentTime = seconds;
        await seeked;
        // Two animation frames let the seeked frame reach the element before it is drawn.
        for (let frame = 0; frame < 2; frame++)
          await new Promise((resolve) => requestAnimationFrame(resolve));
        return readFrameIndex(video);
      };

      /** Reads the 16 columns of the top half, each white for a set bit of the frame index. */
      function readFrameIndex(video) {
        const context = document.getElementById("canvas").getContext("2d", {
          willReadFrequently: true,
        });
        context.drawImage(video, 0, 0, 128, 72);
        const row = context.getImageData(0, 18, 128, 1).data;
        let index = 0;
        for (let bit = 0; bit < 16; bit++)
          if (row[(8 * bit + 4) * 4] > 128) index += 1 << bit;
        return index;
      }
    </script>
  </body>
</html>
