[package]
name = "easyimmerse-native"
description = "The Tauri shell of easyimmerse for desktop and mobile, with the embedded server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "easyimmerse_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "easyimmerse-native"
path = "src/main.rs"

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
easyimmerse-api = { workspace = true }
easyimmerse-storage = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-opener = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ureq = { workspace = true }
