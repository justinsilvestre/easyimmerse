[package]
name = "easyimmerse-native"
description = "The Tauri shell of easyimmerse for desktop and mobile, with the embedded server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "easyimmerse_native_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "easyimmerse-native"
path = "src/main.rs"

[features]
default = []
# Embeds the built hello-rust plugin and exposes the `check_plugin_host` command,
# which the end-to-end tests call to prove the plugin host runs on the platform under test.
plugin-check = []
# Compiles in the WebDriver plugins that the desktop end-to-end tests drive the app through; see webdriver.rs.
webdriver = ["dep:tauri-plugin-wdio", "dep:tauri-plugin-wdio-webdriver"]

[build-dependencies]
tauri-build = { workspace = true }

[dependencies]
easyimmerse-api = { workspace = true }
easyimmerse-plugins = { workspace = true }
easyimmerse-storage = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tauri = { workspace = true }
tauri-plugin-clipboard-manager = { workspace = true }
tauri-plugin-dialog = { workspace = true }
tauri-plugin-notification = { workspace = true }
tauri-plugin-opener = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
ureq = { workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
paranoid-android = { workspace = true }

# iOS forbids just-in-time compilation, so plugins run there only through the Pulley interpreter.
[target.'cfg(target_os = "ios")'.dependencies]
easyimmerse-plugins = { workspace = true, features = ["interpreter"] }

# The webdriver feature turns these on. The mobile end-to-end tests go through Appium instead.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-wdio = { workspace = true, optional = true }
tauri-plugin-wdio-webdriver = { workspace = true, optional = true }
