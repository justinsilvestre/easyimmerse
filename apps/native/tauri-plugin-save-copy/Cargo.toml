# Tauri derives a plugin's name from a crate name of the form `tauri-plugin-<name>`, so this crate has no `easyimmerse-` prefix.
[package]
name = "tauri-plugin-save-copy"
description = "Lets the user keep a copy of a file the app wrote, through the save picker of Android or iOS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
links = "tauri-plugin-save-copy"

[build-dependencies]
tauri-plugin = { workspace = true, features = ["build"] }

[dependencies]
serde = { workspace = true }
tauri = { workspace = true }
thiserror = { workspace = true }
