[tools]
node = "24.21.0"
pnpm = "12.8.1"
# The components and targets mirror rust-toolchain.toml. Installing them together with the
# toolchain keeps rustup's proxies from installing them later, concurrently, when the cargo
# tools below run, which has left a toolchain with unregistered clippy files on Windows.
rust = { version = "1.98.1", profile = "minimal", components = ["clippy", "rustfmt"], targets = ["wasm32-unknown-unknown", "wasm32-wasip2"] }
cargo-binstall = "1.24.0"
"cargo:wasm-pack" = "0.15.0"
"cargo:wasm-tools" = "1.259.0"

[settings]
# Let the cargo backend fetch prebuilt binaries instead of compiling them.
cargo.binstall = true

[env]
_.file = ".env"
# Appium keeps its drivers here, so that each checkout pins its own driver versions.
APPIUM_HOME = "{{config_root}}/apps/native/.appium"
# The Android SDK and NDK the Tauri CLI builds with. A value already in the environment, such as the one CI sets, wins over these defaults for Android Studio's install location.
ANDROID_HOME = "{{ env.ANDROID_HOME | default(value=env.HOME ~ '/Library/Android/sdk') }}"
NDK_HOME = "{{ env.NDK_HOME | default(value=env.ANDROID_HOME ~ '/ndk/28.2.13676358') }}"

[tasks.check]
description = "Lint, typecheck, and test every layer"
# The wasm package and the plugin host tests import build outputs, so those are built first.
depends = ["wasm:build", "plugins:build"]
run = [
  "pnpm biome ci .",
  "pnpm -r typecheck",
  "pnpm -r test",
  "node --test 'scripts/**/*.test.ts'",
  "node scripts/ffmpeg-notices/index.ts --check",
  "node scripts/dependency-notices/index.ts --check",
  "cargo fmt --all --check",
  "cargo fmt --manifest-path plugins/Cargo.toml --all --check",
  "cargo clippy --workspace --exclude easyimmerse-native --all-targets -- -D warnings",
  "cargo test",
]

[tasks.typegen]
description = "Regenerate packages/types/src/generated from Rust with ts-rs"
run = [
  "rm -rf packages/types/src/generated",
  "cargo test -p easyimmerse-core -p easyimmerse-media -p easyimmerse-api --lib export_bindings",
  "node packages/types/scripts/writeGeneratedIndex.ts",
]
sources = ["crates/**/*.rs", "apps/server/**/*.rs"]

[tasks.openapi]
description = "Regenerate crates/api/openapi.json and its TypeScript schema"
run = [
  "EASYIMMERSE_UPDATE_OPENAPI=1 cargo test -p easyimmerse-api --lib the_committed_document_is_current",
  "pnpm --filter @easyimmerse/types generate:openapi",
]
sources = ["crates/**/*.rs", "apps/server/**/*.rs"]

[tasks.watch]
description = "Rerun type generation whenever Rust files change"
run = "mise watch typegen openapi"

[tasks."wasm:build"]
description = "Build the offline WebAssembly module into packages/wasm/pkg"
run = "wasm-pack build crates/wasm --target web --out-dir ../../packages/wasm/pkg --out-name easyimmerse_wasm"

[tasks."plugins:build"]
description = "Build every example plugin to a WebAssembly component"
depends = ["plugins:build-rust", "plugins:build-js"]

[tasks."plugins:build-rust"]
run = "node plugins/build-rust.ts"

[tasks."plugins:build-js"]
run = "pnpm --filter @easyimmerse/plugin-hello-js build"

[tasks."fetch-ffmpeg"]
description = "Download the ffmpeg sidecar binaries for the current platform"
run = "node scripts/fetch-ffmpeg/index.ts"

[tasks."ffmpeg-notices"]
description = "Regenerate the license notices of the ffmpeg builds in the fetch-ffmpeg manifest"
run = "node scripts/ffmpeg-notices/index.ts"

[tasks."ffmpeg-notices:check"]
description = "Fail when the committed ffmpeg license notices no longer match the manifest"
run = "node scripts/ffmpeg-notices/index.ts --check"

[tasks."license-notices"]
description = "Regenerate the license notices of every Rust crate and npm package that ships"
run = "node scripts/dependency-notices/index.ts"

[tasks."license-notices:check"]
description = "Fail when the license notices are stale or a shipped license is outside the allowed list"
run = "node scripts/dependency-notices/index.ts --check"

[tasks."fixtures:media"]
description = "Regenerate the media fixtures with ffmpeg"
run = "sh fixtures/generate-media.sh"

[tasks.e2e]
description = "Run the browser end-to-end tests"
depends = ["wasm:build"]
run = [
  "cargo build -p easyimmerse-server",
  "pnpm --filter @easyimmerse/web e2e",
  "pnpm --filter @easyimmerse/extension e2e",
]

# The drivers are pinned here rather than in package.json because Appium installs them itself.
# The script skips a driver already at its pinned version, so the tasks can run before every test run.
[tasks."appium:install"]
description = "Install the Appium drivers for the mobile end-to-end tests into apps/native/.appium"
depends = ["appium:install:android", "appium:install:ios"]

[tasks."appium:install:android"]
description = "Install the Appium driver for the Android end-to-end tests"
run = "scripts/install-appium-driver.sh uiautomator2 8.7.0"

[tasks."appium:install:ios"]
description = "Install the Appium driver for the iOS end-to-end tests"
run = "scripts/install-appium-driver.sh xcuitest 12.14.0"

# The webdriver feature compiles in the embedded WebDriver server that the tests drive the app through.
# The plugin-check feature embeds the hello-rust plugin, so that plugin is built first.
# Tauri refuses to build the desktop app while a declared ffmpeg sidecar is missing.
[tasks."e2e:desktop"]
description = "Drive a debug build of the desktop app through WebDriver"
depends = ["plugins:build-rust", "fetch-ffmpeg"]
run = [
  "pnpm --filter @easyimmerse/native exec tauri build --debug --no-bundle --config e2e/tauri.conf.json --features plugin-check,webdriver",
  "pnpm --filter @easyimmerse/native e2e",
]

# The emulator runs x86_64. The Android build needs JDK 17 or newer but fails on the newest releases, so the task pins Temurin 17, as CI does.
[tasks."android:build"]
description = "Build a debug APK of the app for the x86_64 emulator, with the global Tauri object for the end-to-end tests"
tools = { java = "temurin-17" }
depends = ["plugins:build-rust"]
run = [
  "[ -d apps/native/src-tauri/gen/android ] || pnpm --filter @easyimmerse/native exec tauri android init --ci --skip-targets-install",
  "pnpm --filter @easyimmerse/native exec tauri android build --debug --target x86_64 --apk --ci --config e2e/tauri.conf.json --features plugin-check",
]

[tasks."e2e:android"]
description = "Drive a debug build of the app on a running Android emulator through Appium"
depends = ["android:build", "appium:install:android"]
run = "pnpm --filter @easyimmerse/native e2e:android"

# The Rust target follows the machine: Apple silicon simulators run arm64 code, Intel ones x86_64.
# On Intel, the generated project is restricted to the simulator platform; see the script.
# `tauri ios init` needs CocoaPods. The task pins Ruby so that no other task installs it,
# and installs CocoaPods as a gem because Mise's gem backend builds a task's gems with the system Ruby.
# The Xcode build phase runs cargo with only PATH and HOME, where the mise shim refuses mise.toml
# as untrusted, so rustup's own cargo comes first on PATH there.
[tasks."ios:build"]
description = "Build a debug app for the iOS simulator, with the global Tauri object for the end-to-end tests"
tools = { ruby = "3.4.11" }
depends = ["plugins:build-rust"]
run = '''
set -e
gem list --installed --exact cocoapods --version 1.17.0 > /dev/null || gem install cocoapods --version 1.17.0
case "$(uname -m)" in arm64) target=aarch64-sim ;; *) target=x86_64 ;; esac
[ -d apps/native/src-tauri/gen/apple ] || pnpm --filter @easyimmerse/native exec tauri ios init --ci --skip-targets-install
[ "$target" = aarch64-sim ] || sh scripts/ios-project-simulator-only.sh
PATH="$HOME/.cargo/bin:$PATH" pnpm --filter @easyimmerse/native exec tauri ios build --debug --target "$target" --no-sign --ci --config e2e/tauri.conf.json --features plugin-check
'''

[tasks."e2e:ios"]
description = "Drive a debug build of the app on an iOS simulator through Appium"
depends = ["ios:build", "appium:install:ios"]
run = "pnpm --filter @easyimmerse/native e2e:ios"

# The guard refuses to start while `mise run web:desktop` serves the same database and cache.
[tasks.desktop]
description = "Run the desktop app in development mode with its embedded server"
depends = ["fetch-ffmpeg"]
run = ["node scripts/web-desktop/guardDesktop.ts", "pnpm --filter @easyimmerse/native dev"]

[tasks.web-dev]
description = "Run the web app with hot reloading against a local server at http://127.0.0.1:8788"
depends = ["web-dev:server", "web-dev:vite"]

[tasks."web-dev:build"]
run = "cargo build -p easyimmerse-server"

# The server keeps its data in .dev/ and seeds the placeholder projects only into a new database.
# Port 8788 leaves 8787 to the desktop app's embedded server.
[tasks."web-dev:server"]
depends = ["web-dev:build"]
env = { EASYIMMERSE_TOKEN = "dev" }
run = '''
mkdir -p .dev
seed=$([ -e .dev/server.sqlite ] || echo --seed-placeholders)
exec cargo run --quiet -p easyimmerse-server -- serve --bind 127.0.0.1:8788 --db .dev/server.sqlite $seed
'''

# Waits for the server build so that a compile error stops the task before Vite starts.
[tasks."web-dev:vite"]
depends = ["web-dev:build"]
env = { VITE_EASYIMMERSE_SERVER_URL = "http://127.0.0.1:8788", VITE_EASYIMMERSE_TOKEN = "dev" }
run = "pnpm --filter @easyimmerse/web dev"

# A debug build of the desktop app writes its server's address, a new random token, and its database and cache paths to .dev/desktop-server.env each time it starts.
# When that server is not running, the task starts a standalone server on the same database and cache at http://127.0.0.1:8789 instead.
# Vite reads the address only at start-up, so restart this task after starting or quitting the desktop app.
[tasks."web:desktop"]
description = "Run the web app with hot reloading against the desktop app's server, or a standalone server on its data"
depends = ["fetch-ffmpeg"]
run = "node scripts/web-desktop/index.ts"

[tasks.storybook]
description = "Serve the UI component stories at http://localhost:6006"
run = "pnpm --filter @easyimmerse/ui storybook"
