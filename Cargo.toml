[workspace]
resolver = "3"
members = ["crates/*", "apps/server", "apps/native/src-tauri"]
default-members = ["crates/*", "apps/server"]
exclude = ["plugins"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/justinsilvestre/easyimmerse"
rust-version = "1.98"

[workspace.dependencies]
easyimmerse-conversion = { path = "crates/conversion" }
easyimmerse-core = { path = "crates/core" }
easyimmerse-media = { path = "crates/media" }
easyimmerse-media-ffmpeg = { path = "crates/media-ffmpeg" }
easyimmerse-storage = { path = "crates/storage" }
easyimmerse-plugin-api = { path = "crates/plugin-api" }
easyimmerse-plugins = { path = "crates/plugins" }
easyimmerse-api = { path = "crates/api" }

adler2 = "2.0"
anyhow = "1.0"
axum = "0.8"
base64 = "0.22"
bzip2-rs = "0.1"
chardetng = "0.1"
clap = { version = "4.6", features = ["derive", "env"] }
csv = "1.4"
encoding_rs = "0.8"
flate2 = { version = "1.1", default-features = false, features = ["zlib-rs"] }
fs4 = "1.1"
hex = "0.4"
lzma-rust2 = { version = "0.21", default-features = false, features = ["std", "xz"] }
lzokay = { version = "2.0", default-features = false, features = ["decompress"] }
matroska = "0.30"
memchr = "2.8"
mp4 = "0.14"
paranoid-android = "0.2"
rand = "0.10"
ripemd = { version = "0.2", default-features = false }
percent-encoding = "2.3"
roxmltree = "0.21"
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rusqlite_migration = "2.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
tauri = "2.12"
tauri-build = "2.7"
tauri-plugin-dialog = "2.8"
tauri-plugin-notification = "2.5"
tauri-plugin-opener = "2.7"
tauri-plugin-wdio = "1.4"
tauri-plugin-wdio-webdriver = "1.4"
tempfile = "3.27"
thiserror = "2.0"
tiny_http = "0.12"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "fs", "signal", "sync"] }
toml = "1.1"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "12.0", features = ["serde-compat", "no-serde-warnings"] }
ureq = "3.4"
utoipa = { version = "6.0", features = ["axum_extras"] }
utoipa-axum = "0.3"
wasm-bindgen = "0.2"
wasmtime = { version = "49.0", default-features = false, features = ["runtime", "cranelift", "component-model", "std"] }
wasmtime-wasi = "49.0"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
strip = true

# Debug builds keep only the line tables of the workspace crates, which is what panic backtraces need,
# and no debug information for dependencies.
# `--profile debugging` builds with full debug information for a debugger.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.debugging]
inherits = "dev"
debug = true

# Optimizes the dependencies that dictionary import spends its time in,
# so that debug builds import large dictionaries in seconds.
# Other dependencies stay unoptimized to keep builds fast.
[profile.dev.package.serde_json]
opt-level = 3

[profile.dev.package.zip]
opt-level = 3

[profile.dev.package.flate2]
opt-level = 3

[profile.dev.package.zlib-rs]
opt-level = 3

[profile.dev.package.libsqlite3-sys]
opt-level = 3

[profile.dev.package.memchr]
opt-level = 3

# Optimizes the storage crate, which serializes and compresses each entry during import.
# Generic serde code is compiled in the crate that uses it, so optimizing serde_json alone does not speed up this work.
# The core crate stays unoptimized, since optimizing it would slow the incremental build of its tests about fourfold.
[profile.dev.package.easyimmerse-storage]
opt-level = 2

# Optimizes the compiler that turns plugins into machine code,
# so that debug builds load a plugin in seconds rather than minutes.
[profile.dev.package.cranelift-codegen]
opt-level = 3

[profile.dev.package.cranelift-frontend]
opt-level = 3

[profile.dev.package.cranelift-entity]
opt-level = 3

[profile.dev.package.cranelift-bforest]
opt-level = 3

[profile.dev.package.cranelift-bitset]
opt-level = 3

[profile.dev.package.cranelift-assembler-x64]
opt-level = 3

[profile.dev.package.cranelift-control]
opt-level = 3

[profile.dev.package.regalloc2]
opt-level = 3

[profile.dev.package.wasmparser]
opt-level = 3

[profile.dev.package.wasmtime-internal-cranelift]
opt-level = 3

[profile.dev.package.gimli]
opt-level = 3

[profile.dev.package.hashbrown]
opt-level = 3

# tauri-plugin-wdio-webdriver 1.4.0 builds against webview2-com 0.38 and fails to compile on Windows
# beside Tauri 2.12's 0.39 (webdriverio/desktop-mobile issue 684). This pins the fix from pull request 687
# until a release carries it. Then remove the patch and run `cargo update -p tauri-plugin-wdio-webdriver`.
[patch.crates-io]
tauri-plugin-wdio-webdriver = { git = "https://github.com/webdriverio/desktop-mobile", rev = "fb4a544bcc49605f6c6fb34f04b292abf428a72a" }
