<html lang="en">

    <meta charset="utf-8" />

    <title>Storybook changes</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --fg: #1a1a1a;
        --muted: #666;
        --line: #ddd;
        --card: #f6f6f6;
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141414;
          --fg: #eee;
          --muted: #999;
          --line: #333;
          --card: #1f1f1f;
          --accent: #60a5fa;
        }
      }
      body {
        margin: 0;
        padding: 16px;
        font: 14px/1.5 system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      .summary {
        color: var(--muted);
        margin: 0 0 16px;
      }
      nav {
        position: sticky;
        top: 0;
        z-index: 1;
        padding: 8px 0;
        background: var(--bg);
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      nav button {
        font: inherit;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--fg);
        cursor: pointer;
      }
      nav button[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--accent);
      }
      article {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 16px;
        background: var(--card);
      }
      article h2 {
        font-size: 15px;
        margin: 0 0 8px;
        display: flex;
        gap: 8px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      .kind {
        font-size: 12px;
        padding: 1px 8px;
        border-radius: 999px;
        border: 1px solid currentColor;
      }
      .kind-changed { color: #b45309; }
      .kind-added { color: #15803d; }
      .kind-removed { color: #b91c1c; }
      .kind-errored { color: #b91c1c; }
      .meta {
        color: var(--muted);
        font-size: 12px;
      }
      .meta a { color: var(--accent); }
      .full-size { margin-left: 6px; color: var(--accent); }
      .variant { margin-top: 12px; }
      .variant h3 {
        font-size: 13px;
        margin: 0 0 6px;
        color: var(--muted);
        font-weight: normal;
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      .variant label { cursor: pointer; }
      .resized { color: #b45309; }
      .images {
        display: flex;
        align-items: flex-start;
        gap: 16px;
      }
      figure {
        flex: 0 1 auto;
        margin: 0;
        min-width: 0;
      }
      figcaption {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .frame {
        position: relative;
        display: inline-block;
        max-width: 100%;
        overflow: hidden;
        vertical-align: top;
        border: 1px solid var(--line);
        background: repeating-linear-gradient(-45deg, var(--line) 0 1px, transparent 1px 6px);
      }
      .frame .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        background: none;
        opacity: 0.8;
        pointer-events: none;
        visibility: hidden;
      }
      :is(.variant:has(.highlight:checked), .flash) .overlay { visibility: visible; }
      figure img {
        display: block;
        max-width: 100%;
        width: auto;
        height: auto;
        background: #fff;
        cursor: pointer;
      }
      pre.error {
        white-space: pre-wrap;
        font-size: 12px;
        color: #b91c1c;
        margin: 8px 0 0;
      }
      .empty { color: var(--muted); }
    </style>
  </head>

    <script>
      const report = JSON.parse(document.getElementById("report").textContent);
      const kinds = ["changed", "added", "removed", "errored"];
      const state = { kind: "all" };

      const count = (kind) => report.changes.filter((change) => change.kind === kind).length;
      document.getElementById("summary").textContent =
        kinds.map((kind) => `${count(kind)} ${kind}`).join(", ") +
        ` of ${report.storyCount} stories` +
        (report.baseLabel ? ` compared with ${report.baseLabel}` : "") +
        ". Click a screenshot to flip between before and after.";

      const filters = document.getElementById("filters");
      for (const kind of ["all", ...kinds]) {
        const button = document.createElement("button");
        button.textContent = kind === "all" ? `All (${report.changes.length})` : `${kind} (${count(kind)})`;
        button.addEventListener("click", () => { state.kind = kind; render(); });
        button.dataset.kind = kind;
        filters.append(button);
      }

      function storyLink(change) {
        if (!report.storybookUrl) return change.importPath;
        const url = new URL(report.storybookUrl, location.href);
        url.search = `?path=/story/${change.id}`;
        return `<a href="${url.href}" target="_blank">${change.importPath}</a>`;
      }

      const pixelsOf = (change) => Object.values(change.changedVariants).reduce((sum, pixels) => sum + pixels, 0);

      function image(change, side, fileName) {
        const src = `${change.id}/${side}-${fileName}`;
        const other = side === "before" ? "after" : "before";
        const hasOther = change.kind === "changed";
        const overlay = change.changedVariants[fileName]
          ? `<img class="overlay" src="${change.id}/diff-${fileName}" alt="" loading="lazy" />` : "";
        return `<figure data-side="${side}"><figcaption><span>${side === "before" ? "Before" : "After"}</span><a class="full-size" href="${src}" target="_blank">full size</a></figcaption>
          <div class="frame"><img src="${src}" alt="${side}" loading="lazy" ${hasOther ? `data-flip="${change.id}/${other}-${fileName}"` : ""} />${overlay}</div></figure>`;
      }

      function variantSection(change, fileName) {
        const pixels = change.changedVariants[fileName];
        const label = fileName.replace(".png", "").replace("-", " / ");
        const sides = change.kind === "added" ? ["after"] : change.kind === "changed" ? ["before", "after"] : ["before"];
        const highlight = pixels ? `<label><input type="checkbox" class="highlight" /> Highlight ${pixels} changed px</label>` : "";
        return `<section class="variant"><h3><span>${label}</span>${highlight}<span class="resized"></span></h3>
          <div class="images">${sides.map((side) => image(change, side, fileName)).join("")}</div></section>`;
      }

      function variantsOf(change) {
        const all = report.variants.map((variant) => `${variant.theme}-${variant.viewport.name}.png`);
        const changed = Object.keys(change.changedVariants).sort((a, b) => change.changedVariants[b] - change.changedVariants[a]);
        return change.kind === "changed" && changed.length > 0 ? changed : all;
      }

      function card(change) {
        const errors = [change.errorBefore && `Before: ${change.errorBefore}`, change.error && `After: ${change.error}`].filter(Boolean);
        return `<article>
          <h2><span class="kind kind-${change.kind}">${change.kind}</span>${change.title} / ${change.name}</h2>
          <div class="meta">${storyLink(change)}</div>
          ${errors.length ? `<pre class="error">${errors.join("\n")}</pre>` : ""}
          ${variantsOf(change).map((fileName) => variantSection(change, fileName)).join("")}
        </article>`;
      }

      function render() {
        for (const button of filters.children) button.setAttribute("aria-pressed", String(button.dataset.kind === state.kind));
        const shown = report.changes
          .filter((change) => state.kind === "all" || change.kind === state.kind)
          .sort((a, b) => pixelsOf(b) - pixelsOf(a));
        document.getElementById("changes").innerHTML = shown.length
          ? shown.map(card).join("")
          : `<p class="empty">No stories ${state.kind === "all" ? "changed" : state.kind}.</p>`;
      }
      render();

      document.addEventListener("click", (event) => {
        const img = event.target.closest("img[data-flip]");
        if (!img) return;
        const flipped = img.dataset.flip;
        img.dataset.flip = img.getAttribute("src");
        img.src = flipped;
        img.parentElement.classList.add("flash");
        setTimeout(() => img.parentElement.classList.remove("flash"), 200);
        const caption = img.closest("figure").querySelector("figcaption span");
        caption.textContent = flipped.includes("/before-") ? "Before" : "After";
      });

      // Records each screenshot's own size on first load, before any flip, to flag stories that grew or shrank.
      // Both sides then share one scale and one frame, sized to the larger of the two and fitted to the row and the screen,
      // so that flipping moves nothing. The diff image has that same size, so the highlight fills the frame.
      document.addEventListener("load", (event) => {
        if (!event.target.matches?.(".frame img")) return;
        const img = event.target;
        if (img.matches(".overlay")) return;
        const section = img.closest(".variant");
        if (!img.dataset.size) {
          img.dataset.size = `${img.naturalWidth}×${img.naturalHeight}`;
          img.dataset.width = img.naturalWidth;
          img.dataset.height = img.naturalHeight;
          const [before, after] = ["before", "after"].map((side) => section.querySelector(`[data-side="${side}"] .frame img`)?.dataset.size);
          if (before && after && before !== after) section.querySelector(".resized").textContent = `Size changed: ${before} → ${after}`;
        }
        const screenshots = [...section.querySelectorAll(".frame img:not(.overlay)")];
        if (!screenshots.every((screenshot) => screenshot.dataset.width)) return;
        const width = Math.max(...screenshots.map((screenshot) => Number(screenshot.dataset.width)));
        const height = Math.max(...screenshots.map((screenshot) => Number(screenshot.dataset.height)));
        const room = (section.querySelector(".images").clientWidth - 16 * (screenshots.length - 1)) / screenshots.length - 2;
        const scale = Math.min(1, room / width, (innerHeight * 0.8) / height);
        for (const screenshot of screenshots) {
          screenshot.style.width = `${screenshot.naturalWidth * scale}px`;
          Object.assign(screenshot.parentElement.style, { width: `${width * scale}px`, height: `${height * scale}px` });
        }
      }, true);
    </script>
