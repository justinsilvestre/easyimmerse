<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Storybook changes</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #fff;
        --fg: #1a1a1a;
        --muted: #666;
        --line: #ddd;
        --card: #f6f6f6;
        --accent: #2563eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #141414;
          --fg: #eee;
          --muted: #999;
          --line: #333;
          --card: #1f1f1f;
          --accent: #60a5fa;
        }
      }
      body {
        margin: 0;
        padding: 16px;
        font: 14px/1.5 system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
      }
      .summary {
        color: var(--muted);
        margin: 0 0 16px;
      }
      nav {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      nav button {
        font: inherit;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--fg);
        cursor: pointer;
      }
      nav button[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--accent);
      }
      article {
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 16px;
        background: var(--card);
      }
      article h2 {
        font-size: 15px;
        margin: 0 0 8px;
        display: flex;
        gap: 8px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      .kind {
        font-size: 12px;
        padding: 1px 8px;
        border-radius: 999px;
        border: 1px solid currentColor;
      }
      .kind-changed { color: #b45309; }
      .kind-added { color: #15803d; }
      .kind-removed { color: #b91c1c; }
      .kind-errored { color: #b91c1c; }
      .meta {
        color: var(--muted);
        font-size: 12px;
      }
      .meta a { color: var(--accent); }
      .variant { margin-top: 12px; }
      .variant h3 {
        font-size: 13px;
        margin: 0 0 6px;
        color: var(--muted);
        font-weight: normal;
      }
      .images {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 8px;
      }
      figure {
        margin: 0;
        min-width: 0;
      }
      figcaption {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      figure img {
        display: block;
        max-width: 100%;
        max-height: 480px;
        width: auto;
        height: auto;
        border: 1px solid var(--line);
        background: #fff;
        cursor: zoom-in;
      }
      pre.error {
        white-space: pre-wrap;
        font-size: 12px;
        color: #b91c1c;
        margin: 8px 0 0;
      }
      .empty { color: var(--muted); }
    </style>
  </head>
  <body>
    <h1>Storybook changes</h1>
    <p class="summary" id="summary"></p>
    <nav id="filters"></nav>
    <main id="changes"></main>

shcards/FailedSavesStatus","name":"Several Not Saved","importPath":"./src/flashcards/unsaved/FailedSavesStatus.stories.tsx","kind":"changed","changedVariants":{"light-phone.png":2712,"light-desktop.png":2826,"dark-phone.png":30783,"dark-desktop.png":30617}},{"id":"flashcards-failedsavesstatus--one-refused-by-the-server","title":"Flashcards/FailedSavesStatus","name":"One Refused By The Server","importPath":"./src/flashcards/unsaved/FailedSavesStatus.stories.tsx","kind":"changed","changedVariants":{"light-phone.png":2712,"light-desktop.png":2826,"dark-phone.png":30783,"dark-desktop.png":30617}},{"id":"flashcards-notbackedupstatus--not-backed-up","title":"Flashcards/NotBackedUpStatus","name":"Not Backed Up","importPath":"./src/flashcards/unsaved/NotBackedUpStatus.stories.tsx","kind":"added","changedVariants":{}},{"id":"screens-settingsscreen--without-conversion","title":"Screens/SettingsScreen","name":"Without Conversion","importPath":"./src/screens/SettingsScreen.stories.tsx","kind":"changed","changedVariants":{"light-phone.png":287380,"light-desktop.png":699319,"dark-phone.png":312404,"dark-desktop.png":739764}},{"id":"screens-settingsscreen--with-converted-videos","title":"Screens/SettingsScreen","name":"With Converted Videos","importPath":"./src/screens/SettingsScreen.stories.tsx","kind":"changed","changedVariants":{"light-phone.png":292056,"light-desktop.png":702972,"dark-phone.png":321798,"dark-desktop.png":748543}},{"id":"screens-settingsscreen--low-disk-space","title":"Screens/SettingsScreen","name":"Low Disk Space","importPath":"./src/screens/SettingsScreen.stories.tsx","kind":"changed","changedVariants":{"light-phone.png":297019,"light-desktop.png":706680,"dark-phone.png":345027,"dark-desktop.png":773935}}],"storybookUrl":"../","baseLabel":"main (25d38ad)"}</script>
    <script>
      const report = JSON.parse(document.getElementById("report").textContent);
      const kinds = ["changed", "added", "removed", "errored"];
      const state = { kind: "all" };

      const count = (kind) => report.changes.filter((change) => change.kind === kind).length;
      document.getElementById("summary").textContent =
        kinds.map((kind) => `${count(kind)} ${kind}`).join(", ") +
        ` of ${report.storyCount} stories` +
        (report.baseLabel ? ` compared with ${report.baseLabel}` : "");

      const filters = document.getElementById("filters");
      for (const kind of ["all", ...kinds]) {
        const button = document.createElement("button");
        button.textContent = kind === "all" ? `All (${report.changes.length})` : `${kind} (${count(kind)})`;
        button.addEventListener("click", () => { state.kind = kind; render(); });
        button.dataset.kind = kind;
        filters.append(button);
      }

      function storyLink(change) {
        if (!report.storybookUrl) return change.importPath;
        const url = new URL(report.storybookUrl, location.href);
        url.search = `?path=/story/${change.id}`;
        return `<a href="${url.href}" target="_blank">${change.importPath}</a>`;
      }

      function image(change, prefix, fileName, caption) {
        const src = `${change.id}/${prefix}-${fileName}`;
        return `<figure><figcaption>${caption}</figcaption><a href="${src}" target="_blank"><img src="${src}" alt="${caption}" loading="lazy" /></a></figure>`;
      }

      function variantSection(change, fileName) {
        const pixels = change.changedVariants[fileName];
        const label = fileName.replace(".png", "").replace("-", " / ");
        const images = [];
        if (change.kind !== "added") images.push(image(change, "before", fileName, "Before"));
        if (change.kind !== "removed" && change.kind !== "errored") images.push(image(change, "after", fileName, "After"));
        if (pixels) images.push(image(change, "diff", fileName, `Diff (${pixels} px)`));
        return `<section class="variant"><h3>${label}</h3><div class="images">${images.join("")}</div></section>`;
      }

      function variantsOf(change) {
        const all = report.variants.map((variant) => `${variant.theme}-${variant.viewport.name}.png`);
        const changed = Object.keys(change.changedVariants);
        return change.kind === "changed" && changed.length > 0 ? changed : all;
      }

      function card(change) {
        const errors = [change.errorBefore && `Before: ${change.errorBefore}`, change.error && `After: ${change.error}`].filter(Boolean);
        return `<article>
          <h2><span class="kind kind-${change.kind}">${change.kind}</span>${change.title} / ${change.name}</h2>
          <div class="meta">${storyLink(change)}</div>
          ${errors.length ? `<pre class="error">${errors.join("\n")}</pre>` : ""}
          ${variantsOf(change).map((fileName) => variantSection(change, fileName)).join("")}
        </article>`;
      }

      function render() {
        for (const button of filters.children) button.setAttribute("aria-pressed", String(button.dataset.kind === state.kind));
        const shown = report.changes.filter((change) => state.kind === "all" || change.kind === state.kind);
        document.getElementById("changes").innerHTML = shown.length
          ? shown.map(card).join("")
          : `<p class="empty">No stories ${state.kind === "all" ? "changed" : state.kind}.</p>`;
      }
      render();
    </script>
  </body>
</html>
