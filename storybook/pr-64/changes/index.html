<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Storybook changes</title>
    <script>
      // Sets the page's theme from the system's before the first paint, so a dark page does not flash light.
      const darkScheme = matchMedia("(prefers-color-scheme: dark)");
      const systemTheme = () => (darkScheme.matches ? "dark" : "light");
      document.documentElement.dataset.theme = systemTheme();
    </script>
    <style>
      :root, [data-theme="light"] {
        color-scheme: light;
        --bg: #fff;
        --fg: #1a1a1a;
        --muted: #666;
        --line: #ddd;
        --card: #f6f6f6;
        --raised: #fff;
        --accent: #2563eb;
        --changed: #b45309;
        --added: #15803d;
        --removed: #b91c1c;
      }
      [data-theme="dark"] {
        color-scheme: dark;
        --bg: #141414;
        --fg: #eee;
        --muted: #999;
        --line: #333;
        --card: #1f1f1f;
        --raised: #2a2a2a;
        --accent: #60a5fa;
        --changed: #f59e0b;
        --added: #4ade80;
        --removed: #f87171;
      }
      /* The same in both themes, and far apart in hue, so the side shows from the corner of the eye. */
      :root {
        --before: #6e4630;
        --after: #3d87f5;
      }
      body {
        margin: 0;
        padding: 0 0 16px;
        font: 14px/1.5 system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      body:has(#comment-dock:not([hidden])) { padding-bottom: 88px; }
      body:has(#viewer[open]) { overflow: hidden; }
      /* Only the page's own header is inset; the stories run to the window's edges. */
      :is(h1, .summary, .toolbar) { padding-inline: 8px; }
      h1 {
        font-size: 18px;
        margin: 0 0 2px;
        padding-top: 10px;
      }
      .summary {
        color: var(--muted);
        margin: 0;
      }
      .toolbar {
        padding-block: 8px;
        display: flex;
        gap: 8px 16px;
        flex-wrap: wrap;
        justify-content: space-between;
      }
      .toolbar > div {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .pill {
        font: inherit;
        font-size: 13px;
        padding: 3px 12px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--raised);
        color: var(--fg);
        cursor: pointer;
      }
      a.pill { text-decoration: none; }
      .pill:hover { border-color: var(--muted); }
      .pill[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--accent);
      }
      .text-button {
        font: inherit;
        padding: 0;
        border: 0;
        background: none;
        color: var(--accent);
        cursor: pointer;
      }
      .text-button:hover { text-decoration: underline; }
      .segmented {
        display: flex;
        margin: 0;
        padding: 0;
        border: 0;
      }
      .segmented .pill:first-child { border-radius: 999px 0 0 999px; }
      .segmented .pill:last-child { border-radius: 0 999px 999px 0; margin-left: -1px; }
      .segmented .pill[aria-pressed="true"] { position: relative; }

      details.story {
        --kind: var(--changed);
        border-block: 1px solid var(--line);
        border-left: 4px solid var(--kind);
        margin-bottom: 8px;
        background: var(--card);
        color: var(--fg);
        scroll-margin-top: 8px;
      }
      details.story.kind-added { --kind: var(--added); }
      details.story:is(.kind-removed, .kind-errored) { --kind: var(--removed); }
      details.story > summary {
        position: sticky;
        top: 0;
        z-index: 2;
        padding: 6px 8px;
        background: var(--card);
        cursor: pointer;
        list-style: none;
        display: flex;
        gap: 8px 12px;
        align-items: center;
        flex-wrap: wrap;
      }
      details.story[open] > summary { border-bottom: 1px solid var(--line); }
      details.story > summary::-webkit-details-marker { display: none; }
      .chevron {
        flex: none;
        width: 7px;
        height: 7px;
        margin: 0 4px;
        border-right: 2px solid var(--muted);
        border-bottom: 2px solid var(--muted);
        transform: rotate(-45deg);
        transition: transform 0.15s;
      }
      details.story[open] .chevron { transform: rotate(45deg); }
      .heading {
        flex: 1 1 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        gap: 2px;
      }
      .title-line { display: block; }
      .kind {
        flex: none;
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
        padding: 5px 10px;
        border-radius: 6px;
        /* Wide enough for the longest kind, so the names beside the badges line up. */
        min-width: 7.5em;
        box-sizing: border-box;
        text-align: center;
        color: var(--kind);
        background: color-mix(in srgb, var(--kind) 14%, transparent);
      }
      .title { font-size: 15px; }
      .title .group { color: var(--muted); }
      h2.component {
        margin: 16px 8px 6px;
        font-size: 13px;
        font-weight: 600;
        color: var(--muted);
      }
      h2.component:first-child { margin-top: 4px; }
      .title .name { font-weight: 600; }
      .nowrap { white-space: nowrap; }
      .icon-button {
        display: inline-grid;
        vertical-align: middle;
        margin-left: 2px;
        place-items: center;
        width: 24px;
        height: 24px;
        padding: 0;
        border: 0;
        border-radius: 4px;
        background: none;
        color: var(--muted);
        cursor: pointer;
      }
      .icon-button:hover { color: var(--fg); background: var(--line); }
      .icon-button svg { width: 14px; height: 14px; }
      .meta {
        color: var(--muted);
        font-size: 12px;
        display: flex;
        gap: 4px 12px;
        flex-wrap: wrap;
      }
      .meta a { color: var(--accent); }
      .heading .meta { overflow-wrap: anywhere; }
      /* The header's first row holds the change type beside the story's name and path; the second, everything else. */
      .header-row {
        flex-basis: 100%;
        display: flex;
        align-items: center;
        gap: 8px 12px;
        min-width: 0;
      }
      /* A wide screen has room for the controls at the end of the first row. */
      @media (min-width: 601px) {
        .header-row.identity { flex: 1 1 0; }
        .header-row.controls { flex-basis: auto; margin-left: auto; }
      }
      .controls {
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 8px;
        font-size: 12px;
        color: var(--muted);
      }
      .comment-toggle::before { content: "✎ "; }
      .story.has-comment .comment-toggle {
        border-color: var(--accent);
        color: var(--accent);
      }
      .story.has-comment .comment-toggle::before { content: "● "; }

      .story-body { padding: 0 4px 4px; }
      /* Sits in the sticky header, across its full width, so it stays in view beside the screenshots it is about. */
      .comment-box {
        position: relative;
        flex-basis: 100%;
        cursor: auto;
      }
      .close-button {
        font: inherit;
        font-size: 18px;
        line-height: 1;
        width: 26px;
        height: 26px;
        padding: 0;
        border: 0;
        border-radius: 4px;
        background: none;
        color: var(--muted);
        cursor: pointer;
      }
      .close-button:hover { color: var(--fg); background: var(--line); }
      .comment-box .hide-comment {
        position: absolute;
        top: 7px;
        right: 10px;
        font-size: 12px;
      }
      .comment-box textarea {
        box-sizing: border-box;
        display: block;
        width: 100%;
        min-height: 3.2em;
        resize: vertical;
        padding: 8px 48px 8px 10px;
        font: inherit;
        color: var(--fg);
        background: var(--raised);
        border: 1px solid var(--line);
        border-radius: 6px;
      }
      .comment-box textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }

      .variants {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 8px;
      }
      .variant {
        margin-top: 6px;
        min-width: 0;
        max-width: 100%;
      }
      .variant h3 {
        font-size: 13px;
        margin: 0 0 4px;
        color: var(--muted);
        font-weight: normal;
        display: flex;
        gap: 0 12px;
        flex-wrap: wrap;
      }
      .variant h3 .viewport { color: var(--fg); font-weight: 600; text-transform: capitalize; }
      .variant label { cursor: pointer; }
      .resized { color: var(--changed); }
      .images {
        display: flex;
        align-items: flex-start;
        gap: 8px;
      }
      figure {
        flex: 0 1 auto;
        margin: 0;
        min-width: 0;
      }
      figure[data-showing="before"], #viewer[data-showing="before"] { --side: var(--before); }
      figure[data-showing="after"], #viewer[data-showing="after"] { --side: var(--after); }

      /*
       * The label spans its screenshot, sticks under the story's header while the screenshot scrolls by, and opens the full-screen viewer.
       * Before and after differ in colour, in where the label's text sits, and in the frame's style, so a flip shows without reading the label.
       * Its zero width keeps it from widening the figure past the screenshot.
       */
      .label {
        position: sticky;
        top: var(--summary-height, 0px);
        z-index: 1;
        box-sizing: border-box;
        width: 0;
        min-width: 100%;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        padding: 2px 6px 4px;
        border: 0;
        font: inherit;
        font-size: 12px;
        color: #fff;
        background: var(--side);
        cursor: zoom-in;
        overflow: hidden;
        white-space: nowrap;
      }
      figure[data-showing="after"] .label { flex-direction: row-reverse; }
      /* The viewport's icon sits on the label's outer edge, beside Before or After. */
      .side-group {
        display: inline-flex;
        align-items: center;
        gap: 5px;
      }
      figure[data-showing="after"] .side-group { flex-direction: row-reverse; }
      .viewport-icon {
        width: 14px;
        height: 14px;
        flex: none;
      }
      .side {
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      .expand {
        opacity: 0.85;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .label:hover .expand { opacity: 1; text-decoration: underline; }
      /* The label closes the frame's top edge, so the two read as one box. */
      .frame {
        position: relative;
        max-width: 100%;
        overflow: hidden;
        border: 4px solid var(--side);
        border-top: 0;
        background: repeating-linear-gradient(-45deg, var(--line) 0 1px, transparent 1px 6px);
      }
      figure[data-showing="before"] .frame { border-style: dashed; }
      .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        opacity: 0.9;
        pointer-events: none;
        visibility: hidden;
      }
      .flash .overlay { visibility: visible; }
      :is(figure, #viewer) img {
        display: block;
        max-width: 100%;
        width: auto;
        height: auto;
        background: #fff;
      }
      /*
       * Darkens everything outside the rectangle around the changes, or on a dark screenshot, veils it, and borders it in the side's colour.
       * The border is an outline, drawn outside the rectangle, so it never covers the changes.
       * The shadow reaches past the frame, which clips it to the screenshot.
       */
      .focus {
        position: absolute;
        box-sizing: border-box;
        pointer-events: none;
        outline: 3px solid var(--side);
        box-shadow: 0 0 0 100vmax rgb(24 24 24 / 0.35);
        visibility: hidden;
      }
      /* A dark screenshot has little left to darken, so a light veil sets the rectangle apart instead. */
      .focus.on-dark { box-shadow: 0 0 0 100vmax rgb(170 170 170 / 0.18); }
      :is(.variant:has(.highlight:checked), #viewer.highlighted) .focus { visibility: visible; }
      :is(figure, #viewer)[data-showing="before"] .focus { outline-style: dashed; }
      /* The diff shows only its red pixels, without the white backing the screenshots have. */
      :is(figure, #viewer) img.overlay { background: none; }
      img[data-flip] { cursor: pointer; }
      pre.error {
        white-space: pre-wrap;
        font-size: 12px;
        color: var(--removed);
        margin: 6px 0 0;
      }
      .empty { color: var(--muted); }
      .story[data-theme="light"] [data-variants="dark"],
      .story[data-theme="dark"] [data-variants="light"] {
        display: none;
      }

      #viewer {
        box-sizing: border-box;
        width: 100vw;
        height: 100dvh;
        max-width: none;
        max-height: none;
        margin: 0;
        padding: 0;
        border: 0;
        background: var(--bg);
        color: var(--fg);
        flex-direction: column;
      }
      #viewer[open] { display: flex; }
      .viewer-bar {
        display: flex;
        align-items: center;
        gap: 8px 16px;
        flex-wrap: wrap;
        padding: 8px 16px;
        color: #fff;
        background: var(--side);
      }
      .viewer-bar .side { font-size: 16px; }
      /* The viewer's buttons keep to the right, also when they wrap below the title. */
      .viewer-actions {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        flex-wrap: wrap;
        gap: 5px;
        margin-left: auto;
      }
      .icon-pill {
        display: inline-grid;
        place-items: center;
        padding: 4px 9px;
      }
      .icon-pill svg { width: 16px; height: 16px; }
      .viewer-bar .close-button { color: #fff; font-size: 24px; margin-left: -6px; }
      .viewer-bar .close-button:hover { background: rgb(255 255 255 / 0.2); }
      .viewer-bar .pill[aria-pressed="true"] { color: #fff; border-color: #fff; background: rgb(255 255 255 / 0.25); }
      #viewer.has-comment .viewer-comment-toggle::before { content: "● "; }
      .viewer-comment { flex: none; padding: 8px 16px 0; }
      .viewer-comment .hide-comment { right: 26px; top: 15px; }
      .viewer-bar .viewport-icon { width: 18px; height: 18px; display: block; }
      .viewer-title { flex: 1 1 200px; min-width: 0; }
      .viewer-bar a, .viewer-bar button { color: #fff; }
      .viewer-bar .pill { background: transparent; border-color: rgb(255 255 255 / 0.6); }
      .viewer-body {
        flex: 1;
        outline: none;
        overflow: auto;
        padding: 8px 0;
      }
      .viewer-frame {
        position: relative;
        overflow: hidden;
        margin: 0 auto;
        background: repeating-linear-gradient(-45deg, var(--line) 0 1px, transparent 1px 6px);
      }
      /* The viewer's background takes the tone of the dimmed area around the changes, so that area blends into it. */
      #viewer[data-shot-theme="light"] :is(.viewer-body, .viewer-comment) { background: #aeaeae; }
      #viewer[data-shot-theme="dark"] :is(.viewer-body, .viewer-comment) { background: #2a2c31; }
      #viewer[data-shot-theme="dark"] .viewer-comment textarea { color: #eee; background: #1d1f23; border-color: #44474d; }
      /* Holds the whole screenshot; zooming moves and enlarges it so that the frame shows only the changed area. */
      .viewer-canvas { position: absolute; }

      #comment-dock {
        position: fixed;
        z-index: 3;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        box-sizing: border-box;
        max-width: calc(100vw - 32px);
        display: flex;
        align-items: center;
        gap: 8px 12px;
        flex-wrap: wrap;
        justify-content: center;
        padding: 8px 12px 8px 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--raised);
        box-shadow: 0 4px 24px rgb(0 0 0 / 0.18);
      }
      #comment-dock[hidden] { display: none; }
      #comment-count { font-weight: 600; }
    </style>
  </head>

    <script>
      const report = JSON.parse(document.getElementById("report").textContent);
      const kinds = ["changed", "added", "removed", "errored"];
      const themeNames = ["light", "dark"];
      // Highlighting starts on, so only the variants it was turned off for are remembered.
      const state = { kind: "all", sort: "storybook", collapsed: new Set(), themes: new Map(), unhighlighted: new Set(), closedComments: new Set() };
      const themeOf = (change) => state.themes.get(change.id) ?? systemTheme();

      const count = (kind) => report.changes.filter((change) => change.kind === kind).length;
      document.getElementById("summary").textContent =
        kinds.map((kind) => `${count(kind)} ${kind}`).join(", ") +
        ` of ${report.storyCount} stories` +
        (report.baseLabel ? ` compared with ${report.baseLabel}` : "") +
        ". Click a screenshot to flip between before and after, or its label to see it full screen. " +
        "Comments you write are kept in this browser until you copy them into the pull request.";

      const filters = document.getElementById("filters");
      for (const kind of ["all", ...kinds]) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "pill";
        button.textContent = kind === "all" ? `All (${report.changes.length})` : `${kind} (${count(kind)})`;
        button.addEventListener("click", () => { state.kind = kind; render(); });
        button.dataset.kind = kind;
        filters.append(button);
      }

      const sortButtons = document.querySelectorAll("[data-sort]");
      for (const button of sortButtons) {
        button.addEventListener("click", () => { state.sort = button.dataset.sort; render(); });
      }

      // Both themes are already in the story, so switching only changes which one is visible.
      function switchTheme(story, name) {
        state.themes.set(story.dataset.id, name);
        story.dataset.theme = name;
        for (const button of story.querySelectorAll("[data-theme-choice]")) button.setAttribute("aria-pressed", String(button.dataset.themeChoice === name));
        layoutStory(story);
      }

      const copyIcon = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5"/><path d="M10.5 3.5v-1a1 1 0 0 0-1-1h-7a1 1 0 0 0-1 1v7a1 1 0 0 0 1 1h1"/></svg>`;
      const copiedIcon = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 8.5l3.5 3.5L13 4.5"/></svg>`;

      /** Copies the text and says so on the button for a moment: in words, or for an icon button, with a tick. */
      async function copyText(button, text) {
        // Kept on the button, so a second click while it shows the result still restores the original content.
        button.dataset.content ??= button.innerHTML;
        const content = button.dataset.content;
        const icon = button.classList.contains("icon-button");
        try {
          await navigator.clipboard.writeText(text);
          button.innerHTML = icon ? copiedIcon : "Copied";
        } catch {
          button.textContent = icon ? "!" : "Copy failed";
        }
        setTimeout(() => { button.innerHTML = content; }, 1500);
      }

      // Comments are kept in the browser's storage under the report's address, so they survive a closed tab and a redeployed report.
      // Storage can be unavailable, as in some private windows; the comments then last as long as the page.
      const commentsKey = `storybook-diff-comments:${location.pathname}`;
      const comments = readComments();

      function readComments() {
        try {
          return JSON.parse(localStorage.getItem(commentsKey) ?? "{}");
        } catch {
          return {};
        }
      }

      function writeComments() {
        try {
          localStorage.setItem(commentsKey, JSON.stringify(comments));
        } catch {}
        updateDock();
      }

      const commentedIds = () => Object.keys(comments).filter((id) => comments[id].text.trim());
      const storyTitle = (change) => `${change.title} / ${change.name}`;

      function storyUrl(id) {
        const url = new URL(location.href);
        url.hash = id;
        return url.href;
      }

      /** The comments in the report's order, then any left from stories this report no longer shows. */
      function commentsMarkdown() {
        const order = report.changes.map((change) => change.id);
        const ids = commentedIds().sort((a, b) => (order.indexOf(a) + 1 || Infinity) - (order.indexOf(b) + 1 || Infinity));
        return ids.map((id) => `**[${comments[id].title}](${storyUrl(id)})**\n\n${comments[id].text.trim()}`).join("\n\n---\n\n").concat("\n");
      }

      const dock = document.getElementById("comment-dock");
      if (report.pullRequestUrl) {
        const pullRequestLink = Object.assign(document.createElement("a"), {
          className: "pill",
          href: report.pullRequestUrl,
          target: "_blank",
          textContent: "Open pull request",
        });
        document.getElementById("copy-comments").after(pullRequestLink);
      }

      // The bar hides when dismissed, or on its own once the page has scrolled a little way from where it appeared. It comes
      // back when a comment box is closed, or when the page is scrolled to its top or bottom after being scrolled away from
      // both, so hiding it at the top does not bring it straight back.
      const dockState = { dismissed: false, leftEdge: false, shownAtY: 0 };
      const autoHideDistance = 400;

      function updateDock() {
        const total = commentedIds().length;
        const wasHidden = dock.hidden;
        dock.hidden = total === 0 || dockState.dismissed;
        if (wasHidden && !dock.hidden) dockState.shownAtY = scrollY;
        document.getElementById("comment-count").textContent = `${total} ${total === 1 ? "comment" : "comments"}`;
      }

      function showDock() {
        dockState.dismissed = false;
        updateDock();
      }

      const edgeDistance = 80;
      const atEdge = () => scrollY < edgeDistance || innerHeight + scrollY > document.documentElement.scrollHeight - edgeDistance;

      // Hidden away from the top and bottom, the bar has already left them, so reaching either brings it back.
      function hideDock() {
        Object.assign(dockState, { dismissed: true, leftEdge: !atEdge() });
        updateDock();
      }

      document.getElementById("hide-dock").addEventListener("click", hideDock);

      addEventListener("scroll", () => {
        if (!dockState.dismissed) {
          if (!dock.hidden && Math.abs(scrollY - dockState.shownAtY) > autoHideDistance) hideDock();
          return;
        }
        if (!atEdge()) dockState.leftEdge = true;
        else if (dockState.leftEdge) showDock();
      }, { passive: true });

      document.getElementById("copy-comments").addEventListener("click", (event) => copyText(event.currentTarget, commentsMarkdown()));
      document.getElementById("clear-comments").addEventListener("click", () => {
        if (!confirm("Delete every comment on this report from this browser?")) return;
        for (const id of Object.keys(comments)) delete comments[id];
        writeComments();
        render();
      });

      document.addEventListener("change", (event) => {
        const checkbox = event.target.closest?.(".highlight");
        if (!checkbox) return;
        if (checkbox.checked) state.unhighlighted.delete(checkbox.dataset.key);
        else state.unhighlighted.add(checkbox.dataset.key);
      });

      document.addEventListener("input", (event) => {
        const textarea = event.target.closest(".comment-box textarea");
        if (!textarea) return;
        // The story's own box and the full-screen viewer's edit the same comment, so each keeps the other up to date.
        const id = textarea.closest("[data-id]").dataset.id;
        const change = report.changes.find((candidate) => candidate.id === id);
        if (textarea.value.trim()) comments[id] = { title: storyTitle(change), text: textarea.value };
        else delete comments[id];
        for (const element of document.querySelectorAll(`[data-id="${CSS.escape(id)}"]`)) {
          element.classList.toggle("has-comment", Boolean(comments[id]));
          const other = element.querySelector(".comment-box textarea");
          if (other && other !== textarea) other.value = textarea.value;
        }
        writeComments();
      });

      // An emptied comment box closes once it loses focus.
      document.addEventListener("focusout", (event) => {
        const textarea = event.target.closest?.(".comment-box textarea");
        if (textarea && !textarea.value.trim()) textarea.parentElement.hidden = true;
      });

      // Pressing Comment takes the focus from an empty box, which closes it before the click arrives, so whether the box
      // was open is noted as the press starts, and the click closes it rather than opening it again.
      document.addEventListener("pointerdown", (event) => {
        const toggle = event.target.closest(".comment-toggle");
        const box = toggle?.closest("[data-id]")?.querySelector(".comment-box");
        if (box) toggle.dataset.boxWasOpen = String(!box.hidden);
      }, true);

      /** Hides a story's comment box, keeping what is in it; the Comment button opens it again. */
      function closeComment(story) {
        story.querySelector(".comment-box").hidden = true;
        state.closedComments.add(story.dataset.id);
        showDock();
      }

      function toggleComment(story, button) {
        const box = story.querySelector(".comment-box");
        const textarea = box.querySelector("textarea");
        const wasOpen = button.dataset.boxWasOpen ? button.dataset.boxWasOpen === "true" : !box.hidden;
        delete button.dataset.boxWasOpen;
        if (wasOpen) {
          if (textarea.value.trim()) closeComment(story);
          else box.hidden = true;
          return;
        }
        story.open = true;
        box.hidden = false;
        state.closedComments.delete(story.dataset.id);
        textarea.focus();
      }

      // Another tab of the same report keeps its comments in step with this one.
      addEventListener("storage", (event) => {
        if (event.key !== commentsKey) return;
        for (const id of Object.keys(comments)) delete comments[id];
        Object.assign(comments, readComments());
        render();
      });

      // Clicking into the comment box in a story's header must not also open or close the story, and neither must typing
      // in it: the browser turns Space and Enter there into a click on the header, one with no mouse behind it.
      document.addEventListener("click", (event) => {
        const typing = event.detail === 0 && document.activeElement?.closest("summary .comment-box");
        if (event.target.closest("summary .comment-box") || typing) event.preventDefault();
      });

      // Buttons in a story's header act on their own instead of also opening or closing the story.
      document.addEventListener("click", (event) => {
        const button = event.target.closest("summary button");
        if (!button) return;
        event.preventDefault();
        const story = button.closest("details.story");
        if (button.dataset.themeChoice) switchTheme(story, button.dataset.themeChoice);
        else if (button.classList.contains("comment-toggle")) toggleComment(story, button);
        else if (button.classList.contains("hide-comment")) closeComment(story);
        else copyText(button, button.dataset.copy);
      });

      // Stories left on the system's theme follow it when it changes.
      darkScheme.addEventListener("change", () => {
        document.documentElement.dataset.theme = systemTheme();
        render();
      });

      document.getElementById("collapse-all").addEventListener("click", () => {
        for (const story of document.querySelectorAll("details.story")) story.open = false;
      });
      document.getElementById("expand-all").addEventListener("click", () => {
        for (const story of document.querySelectorAll("details.story")) story.open = true;
      });

      // Each story's header wraps to its own height, under which that story's screenshot labels stick.
      const summaryHeights = new ResizeObserver((entries) => {
        for (const entry of entries) entry.target.parentElement.style.setProperty("--summary-height", `${entry.borderBoxSize[0].blockSize}px`);
      });

      function storyLink(change) {
        if (!report.storybookUrl) return change.importPath;
        const url = new URL(report.storybookUrl, location.href);
        url.search = `?path=/story/${change.id}`;
        return `<a href="${url.href}" target="_blank" title="Open in Storybook">${change.importPath}</a>`;
      }

      const fileNameOf = (variant) => `${variant.theme}-${variant.viewport.name}.png`;
      const pixelsOf = (change) => Object.values(change.changedVariants).reduce((sum, pixels) => sum + pixels, 0);
      const sizeOf = (change, side, fileName) => change.imageSizes[`${side}-${fileName}`];
      /** Shows both dimensions, striking out the old value of each one that changed, so a change in width alone or height alone stands out. */
      function describeResize(before, after) {
        if (!before || !after || (before.width === after.width && before.height === after.height)) return "";
        const dimension = (from, to) => (from === to ? `${to}` : `<s>${from}</s> → <b>${to}</b>`);
        return `<span class="resized">Size ${dimension(before.width, after.width)} × ${dimension(before.height, after.height)}</span>`;
      }

      /** Lists a theme's screenshots that the comparison copied for a story. */
      const shownVariants = (change, themeName) =>
        report.variants
          .filter((variant) => variant.theme === themeName)
          .filter((variant) => ["before", "after"].some((side) => sizeOf(change, side, fileNameOf(variant))));

      /** Marks the rectangle around the variant's changes, in percentages of its largest screenshot so it fits any scale. */
      function focus(change, fileName) {
        const area = change.changedAreas?.[fileName];
        if (!area) return "";
        const [width, height] = ["width", "height"].map((dimension) =>
          Math.max(...["before", "after"].map((side) => sizeOf(change, side, fileName)?.[dimension] ?? 0)));
        // A little room around the changes, so the darkening does not start right at their edge.
        const padding = 6;
        const left = Math.max(0, area.x - padding);
        const top = Math.max(0, area.y - padding);
        const right = Math.min(width, area.x + area.width + padding);
        const bottom = Math.min(height, area.y + area.height + padding);
        const percent = (value, total) => `${(value / total) * 100}%`;
        return `<div class="focus ${fileName.startsWith("dark-") ? "on-dark" : ""}" style="left: ${percent(left, width)}; top: ${percent(top, height)}; width: ${percent(right - left, width)}; height: ${percent(bottom - top, height)}"></div>`;
      }

      /** Icons for the viewports captureVariants.ts defines; a viewport without one is named by the text above it alone. */
      const viewportIcons = {
        phone: `<svg class="viewport-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="4.25" y="1.25" width="7.5" height="13.5" rx="1.5"/><path d="M7 12.25h2"/></svg>`,
        desktop: `<svg class="viewport-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1.25" y="2.25" width="13.5" height="9" rx="1"/><path d="M5.5 14.25h5M8 11.25v3"/></svg>`,
      };
      const viewportIcon = (fileName) => viewportIcons[fileName.replace(/^\w+-|\.png$/g, "")] ?? "";

      function image(change, side, fileName) {
        const src = `${change.id}/${side}-${fileName}`;
        const size = sizeOf(change, side, fileName);
        const other = side === "before" ? "after" : "before";
        const otherSize = sizeOf(change, other, fileName);
        const flip = change.kind === "changed"
          ? `data-flip="${change.id}/${other}-${fileName}" data-flip-width="${otherSize?.width}" data-flip-height="${otherSize?.height}"` : "";
        const overlay = change.changedVariants[fileName]
          ? `<img class="overlay" src="${change.id}/diff-${fileName}" alt="" loading="lazy" />` : "";
        return `<figure data-showing="${side}"><button type="button" class="label" title="Show full screen"><span class="side-group">${viewportIcon(fileName)}<span class="side">${side}</span></span><span class="expand">⤢ Full screen</span></button>
          <div class="frame"><img src="${src}" alt="${side}" loading="lazy" data-width="${size.width}" data-height="${size.height}" ${flip} />${overlay}${focus(change, fileName)}</div></figure>`;
      }

      function variantSection(change, variant) {
        const fileName = fileNameOf(variant);
        const pixels = change.changedVariants[fileName];
        const sides = ["before", "after"].filter((side) => sizeOf(change, side, fileName));
        const status = pixels
          ? `<label><input type="checkbox" class="highlight" data-key="${change.id}/${fileName}" ${state.unhighlighted.has(`${change.id}/${fileName}`) ? "" : "checked"} /> Highlight changes (${pixels.toLocaleString("en-US")} px)</label>`
          : change.kind === "changed" ? `<span>No change in the ${variant.theme} theme</span>` : "";
        const resized = describeResize(sizeOf(change, "before", fileName), sizeOf(change, "after", fileName));
        return `<section class="variant" data-viewport="${variant.viewport.name}"><h3><span class="viewport">${variant.viewport.name}</span>${status}${resized}</h3>
          <div class="images">${sides.map((side) => image(change, side, fileName)).join("")}</div></section>`;
      }

      const variantsBody = (change) =>
        themeNames.map((themeName) => `<div class="variants" data-variants="${themeName}">
          ${shownVariants(change, themeName).map((variant) => variantSection(change, variant)).join("")}</div>`).join("");

      const themeSwitch = (change) =>
        `<span class="segmented" role="group" aria-label="Theme">${themeNames.map((name) =>
          `<button type="button" class="pill" data-theme-choice="${name}" aria-pressed="${name === themeOf(change)}">${name === "light" ? "Light" : "Dark"}</button>`).join("")}</span>`;

      /** A story's card; when it sits under its component's heading, its header leaves the component's name out. */
      function card(change, grouped) {
        const errors = [change.errorBefore && `Before: ${change.errorBefore}`, change.error && `After: ${change.error}`].filter(Boolean);
        const commented = Boolean(comments[change.id]);
        const commentShown = commented && !state.closedComments.has(change.id);
        return `<details class="story kind-${change.kind} ${commented ? "has-comment" : ""}" id="${change.id}" data-id="${change.id}" data-theme="${themeOf(change)}" ${state.collapsed.has(change.id) ? "" : "open"}>
          <summary>
            <span class="header-row identity">
            <span class="chevron" aria-hidden="true"></span>
            <span class="kind">${change.kind}</span>
            <span class="heading">
              <span class="title-line"><span class="title">${grouped ? "" : `<span class="group">${change.title} /</span> `}<span class="nowrap"><span class="name">${change.name}</span>
                <button type="button" class="icon-button" data-copy="${storyTitle(change).replaceAll('"', "&quot;")}" title="Copy name" aria-label="Copy name">${copyIcon}</button></span></span></span>
              <span class="meta">${storyLink(change)}</span>
            </span>
            </span>
            <span class="header-row controls"><button type="button" class="pill comment-toggle">Comment</button>${themeSwitch(change)}</span>
            <div class="comment-box" ${commentShown ? "" : "hidden"}>
              <textarea rows="2" placeholder="What should change in this story? Saved in this browser as you type." aria-label="Comment on ${storyTitle(change).replaceAll('"', "&quot;")}"></textarea>
              <button type="button" class="text-button hide-comment" title="The comment is kept; Comment opens it again">Hide</button>
            </div>
          </summary>
          <div class="story-body">
            ${errors.length ? `<pre class="error">${errors.join("\n")}</pre>` : ""}
            ${variantsBody(change)}
          </div>
        </details>`;
      }

      const sortByPixels = (changes) => [...changes].sort((a, b) => pixelsOf(b) - pixelsOf(a));

      // Storybook's sidebar lists components by title, and each component's stories in the order it declares them,
      // which is the order the capture lists them in. The sort is stable, so that order holds within each title.
      function componentGroups(changes) {
        const sorted = [...changes].sort((a, b) => a.title.localeCompare(b.title));
        return sorted.map((change, index) => (sorted[index - 1]?.title === change.title ? "" : `<h2 class="component">${change.title}</h2>`) + card(change, true)).join("");
      }

      function render() {
        for (const button of filters.children) button.setAttribute("aria-pressed", String(button.dataset.kind === state.kind));
        for (const button of sortButtons) button.setAttribute("aria-pressed", String(button.dataset.sort === state.sort));
        const shown = report.changes.filter((change) => state.kind === "all" || change.kind === state.kind);
        document.getElementById("changes").innerHTML = shown.length
          ? state.sort === "pixels" ? sortByPixels(shown).map((change) => card(change, false)).join("") : componentGroups(shown)
          : `<p class="empty">No stories ${state.kind === "all" ? "changed" : state.kind}.</p>`;
        // Set as a value rather than written into the markup, so a comment's text is never read as HTML.
        for (const story of document.querySelectorAll("details.story")) story.querySelector(".comment-box textarea").value = comments[story.dataset.id]?.text ?? "";
        document.querySelectorAll("details.story[open]").forEach(layoutStory);
        summaryHeights.disconnect();
        for (const summary of document.querySelectorAll("details.story > summary")) summaryHeights.observe(summary);
      }

      // Keeps a collapsed story's header in view, since collapsing a long story while its header is stuck to the top would scroll it out of sight.
      document.addEventListener("toggle", (event) => {
        const story = event.target;
        if (!story.matches?.("details.story")) return;
        if (story.open) {
          state.collapsed.delete(story.dataset.id);
          layoutStory(story);
        } else {
          state.collapsed.add(story.dataset.id);
          if (story.getBoundingClientRect().top < 0) story.scrollIntoView({ block: "start" });
        }
      }, true);

      /** Swaps a screenshot for the other side's, and flashes the changed pixels over it. */
      function flip(img) {
        const flipped = img.dataset.flip;
        img.dataset.flip = img.getAttribute("src");
        img.src = flipped;
        [img.dataset.width, img.dataset.flipWidth] = [img.dataset.flipWidth, img.dataset.width];
        [img.dataset.height, img.dataset.flipHeight] = [img.dataset.flipHeight, img.dataset.height];
        img.style.width = `${img.dataset.width * img.closest(".variant").dataset.scale}px`;
        flash(img.parentElement);
        const side = flipped.includes("/before-") ? "before" : "after";
        const figure = img.closest("figure");
        figure.dataset.showing = side;
        figure.querySelector(".side").textContent = side;
      }

      function flash(frame) {
        frame.classList.add("flash");
        setTimeout(() => frame.classList.remove("flash"), 200);
      }

      document.addEventListener("click", (event) => {
        const img = event.target.closest("figure img[data-flip]");
        if (img) flip(img);
        const label = event.target.closest("figure .label");
        if (label) showFullScreen(label.closest("figure"));
      });

      // The viewer shows one screenshot at its own size, capped at the screen's width, and flips the same way the story does,
      // so flipping in either place leaves both on the same side. It asks for the browser's full screen where the browser allows it,
      // and otherwise, as on a phone, fills the window.
      const viewer = document.getElementById("viewer");
      const viewerFrame = viewer.querySelector(".viewer-frame");
      const viewerCanvas = viewerFrame.querySelector(".viewer-canvas");
      const [viewerImage, viewerOverlay] = viewerFrame.querySelectorAll("img");
      const zoomButton = viewer.querySelector(".viewer-zoom");
      // Zooming starts on, and stays as it was left for the next screenshot opened.
      let zoomToChanges = true;
      /** How much of the screenshot around the changed area a zoomed view keeps, in its pixels. */
      const zoomContext = 40;
      /** The most a zoomed view enlarges a screenshot, so a tiny change does not turn into a blur. */
      const maxZoom = 3;
      let viewedFigure = null;
      // Made here rather than in the markup, where a link must have an address before it has one to show.
      const viewerOriginal = Object.assign(document.createElement("a"), {
        className: "pill icon-pill",
        target: "_blank",
        title: "Open the image in a new tab",
        innerHTML: `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M9.5 2.5h4v4M13.5 2.5 7.5 8.5M11.5 9.5v3a1 1 0 0 1-1 1h-7a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1h3"/></svg>`,
      });
      viewerOriginal.setAttribute("aria-label", "Open image");
      viewer.querySelector(".viewer-zoom").before(viewerOriginal);
      const flipHint = matchMedia("(pointer: coarse)").matches ? " · tap to flip" : " · click or press space to flip";

      function showFullScreen(figure) {
        viewedFigure = figure;
        const id = figure.closest("details.story").dataset.id;
        viewer.dataset.id = id;
        viewer.classList.toggle("has-comment", Boolean(comments[id]));
        viewerComment.querySelector("textarea").value = comments[id]?.text ?? "";
        viewerComment.hidden = !comments[id];
        // Opened before it is filled, since a zoomed view is fitted to the room the open viewer has.
        viewer.showModal();
        syncViewer();
        // Focus starts on the screenshot rather than the bar's link, so the space bar flips instead of following it.
        viewer.querySelector(".viewer-body").focus();
        viewer.requestFullscreen?.().catch(() => {});
      }

      function syncViewer() {
        const img = viewedFigure.querySelector(".frame img:not(.overlay)");
        const overlay = viewedFigure.querySelector(".overlay");
        const story = viewedFigure.closest("details.story");
        const variant = viewedFigure.closest(".variant");
        const side = viewedFigure.dataset.showing;
        const width = Math.max(img.dataset.width, img.dataset.flipWidth || 0);
        const height = Math.max(img.dataset.height, img.dataset.flipHeight || 0);
        viewer.dataset.showing = side;
        viewer.dataset.shotTheme = story.dataset.theme;
        for (const button of viewer.querySelectorAll("[data-viewer-theme]")) button.setAttribute("aria-pressed", String(button.dataset.viewerTheme === story.dataset.theme));
        viewer.classList.toggle("highlighted", Boolean(variant.querySelector(".highlight:checked")));
        viewer.querySelector(".side").textContent = side;
        viewer.querySelector(".viewer-icon").innerHTML = viewportIcons[variant.dataset.viewport] ?? "";
        viewer.querySelector(".viewer-title").textContent =
          `${storyTitle(report.changes.find((change) => change.id === story.dataset.id))}${img.dataset.flip ? flipHint : ""}`;
        viewerOriginal.href = img.getAttribute("src");
        const change = report.changes.find((candidate) => candidate.id === story.dataset.id);
        const area = change.changedAreas?.[`${story.dataset.theme}-${variant.dataset.viewport}.png`];
        zoomButton.hidden = !area;
        zoomButton.setAttribute("aria-pressed", String(zoomToChanges));
        zoomButton.innerHTML = zoomIcon(zoomToChanges);
        zoomButton.title = zoomToChanges ? "Show the whole screenshot" : "Zoom to the changes";
        zoomButton.setAttribute("aria-label", "Zoom to changes");
        // The part of the screenshot the frame shows: all of it, or the changed area with some context around it.
        const shown = area && zoomToChanges
          ? clampedArea(area.x - zoomContext, area.y - zoomContext, area.x + area.width + zoomContext, area.y + area.height + zoomContext, width, height)
          : { x: 0, y: 0, width, height };
        // A zoomed view fits the screen's height as well as its width, so the whole changed area is in view at once.
        const zoomed = shown.width !== width || shown.height !== height;
        const roomHeight = viewer.querySelector(".viewer-body").clientHeight - 16;
        const widths = [`${shown.width * (zoomed ? maxZoom : 1)}px`, ...(zoomed ? [`${(roomHeight * shown.width) / shown.height}px`] : [])];
        Object.assign(viewerFrame.style, { width: `min(100%, ${widths.join(", ")})`, aspectRatio: `${shown.width} / ${shown.height}` });
        const percent = (value, total) => `${(value / total) * 100}%`;
        Object.assign(viewerCanvas.style, {
          left: `-${percent(shown.x, shown.width)}`,
          top: `-${percent(shown.y, shown.height)}`,
          width: percent(width, shown.width),
          height: percent(height, shown.height),
        });
        viewerImage.src = img.getAttribute("src");
        viewerImage.style.width = `${(img.dataset.width / width) * 100}%`;
        viewerImage.style.cursor = img.dataset.flip ? "pointer" : "auto";
        viewerCanvas.querySelector(".focus")?.remove();
        const focusArea = viewedFigure.querySelector(".focus");
        if (focusArea) viewerCanvas.append(focusArea.cloneNode());
        viewerOverlay.hidden = !overlay;
        if (overlay) viewerOverlay.src = overlay.getAttribute("src");
      }

      /** A magnifier, with a plus while zoomed to the changes and a minus while showing the whole screenshot. */
      const zoomIcon = (zoomed) =>
        `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="6.75" cy="6.75" r="4.75"/><path d="M10.25 10.25 14.5 14.5M4.5 6.75h4.5${zoomed ? "M6.75 4.5v4.5" : ""}"/></svg>`;

      function clampedArea(left, top, right, bottom, width, height) {
        const [x, y] = [Math.max(0, left), Math.max(0, top)];
        return { x, y, width: Math.min(width, right) - x, height: Math.min(height, bottom) - y };
      }

      zoomButton.addEventListener("click", () => {
        zoomToChanges = !zoomToChanges;
        syncViewer();
      });

      function flipInViewer() {
        const img = viewedFigure.querySelector("img[data-flip]");
        if (!img) return;
        flip(img);
        syncViewer();
        flash(viewerFrame);
      }

      viewerImage.addEventListener("click", flipInViewer);
      viewer.addEventListener("keydown", (event) => {
        if (![" ", "ArrowLeft", "ArrowRight"].includes(event.key) || event.target.closest("a, button, textarea")) return;
        event.preventDefault();
        flipInViewer();
      });
      viewer.querySelector(".viewer-close").addEventListener("click", () => viewer.close());

      // The viewer's Comment and theme buttons act on the story it shows, as the story's own do.
      const viewerComment = viewer.querySelector(".viewer-comment");
      viewer.querySelector(".viewer-comment-toggle").addEventListener("click", (event) => {
        const textarea = viewerComment.querySelector("textarea");
        const button = event.currentTarget;
        const wasOpen = button.dataset.boxWasOpen ? button.dataset.boxWasOpen === "true" : !viewerComment.hidden;
        delete button.dataset.boxWasOpen;
        if (wasOpen) {
          viewerComment.hidden = true;
          return;
        }
        viewerComment.hidden = false;
        textarea.focus();
      });
      viewerComment.querySelector(".hide-comment").addEventListener("click", () => { viewerComment.hidden = true; });

      // Switching theme shows the same viewport and side in the other theme.
      for (const button of viewer.querySelectorAll("[data-viewer-theme]")) {
        button.addEventListener("click", () => {
          const story = viewedFigure.closest("details.story");
          const viewport = viewedFigure.closest(".variant").dataset.viewport;
          const position = [...viewedFigure.parentElement.children].indexOf(viewedFigure);
          switchTheme(story, button.dataset.viewerTheme);
          const figures = story.querySelector(`.variants[data-variants="${story.dataset.theme}"] .variant[data-viewport="${viewport}"] .images`)?.children;
          if (figures?.[position]) viewedFigure = figures[position];
          syncViewer();
        });
      }
      viewer.addEventListener("close", () => {
        if (document.fullscreenElement) document.exitFullscreen();
      });
      // Escape leaves the browser's full screen before the dialog sees it, so leaving full screen closes the viewer too.
      document.addEventListener("fullscreenchange", () => {
        if (!document.fullscreenElement && viewer.open) viewer.close();
        else if (viewer.open) syncViewer();
      });
      addEventListener("resize", () => {
        if (viewer.open) syncViewer();
      });

      let resizeFrame = 0;
      addEventListener("resize", () => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(() => document.querySelectorAll("details.story[open]").forEach(layoutStory));
      });

      const gap = 8;
      /** The frame's border on both sides of a screenshot. */
      const border = 8;
      const minVariantWidth = 180;
      /** Variants share a row only when none is shown at less than this scale, or than its scale on a row of its own if that is smaller. */
      const minSharedScale = 0.5;

      // Sizes the screenshots of a story's visible theme from the sizes the report records, so nothing moves while they load.
      // Within a variant, both sides share one scale and one frame, sized to the larger of the two, so that flipping moves nothing,
      // and the diff image has that same size, so the highlight fills the frame.
      // Variants are packed into rows, such as phone beside desktop, when they fit side by side at a common scale cap without shrinking too far.
      function layoutStory(story) {
        const variants = story.querySelector(`.variants[data-variants="${story.dataset.theme}"]`);
        const room = variants?.clientWidth;
        if (!room) return;
        const metrics = [...variants.querySelectorAll(".variant")].map((section) => measureVariant(section, room));
        for (const row of packRows(metrics, room)) {
          const cap = largestCap(row, room);
          for (const metric of row) applyScale(metric, Math.min(metric.fullScale, cap));
        }
      }

      function measureVariant(section, room) {
        const shots = [...section.querySelectorAll(".frame img:not(.overlay)")];
        const width = Math.max(...shots.map((shot) => Number(shot.dataset.width)));
        const height = Math.max(...shots.map((shot) => Number(shot.dataset.height)));
        const fixed = shots.length * border + gap * (shots.length - 1);
        const fullScale = Math.min(1, (room - fixed) / (shots.length * width), (innerHeight * 0.8) / height);
        return { section, shots, width, height, fixed, fullScale };
      }

      const variantWidth = (metric, cap) =>
        Math.max(minVariantWidth, metric.fixed + metric.shots.length * metric.width * Math.min(metric.fullScale, cap));

      const rowFits = (row, cap, room) =>
        row.reduce((sum, metric) => sum + variantWidth(metric, cap), gap * (row.length - 1)) <= room;

      function largestCap(row, room) {
        if (rowFits(row, 1, room)) return 1;
        let low = 0;
        let high = 1;
        for (let step = 0; step < 20; step++) {
          const middle = (low + high) / 2;
          if (rowFits(row, middle, room)) low = middle;
          else high = middle;
        }
        return low;
      }

      function packRows(metrics, room) {
        const rows = [];
        for (const metric of metrics) {
          const row = rows.at(-1);
          const candidate = row && [...row, metric];
          const floor = candidate && Math.min(minSharedScale, Math.max(...candidate.map((item) => item.fullScale)));
          if (candidate && largestCap(candidate, room) >= floor) row.push(metric);
          else rows.push([metric]);
        }
        return rows;
      }

      function applyScale(metric, scale) {
        metric.section.style.width = `${variantWidth(metric, scale)}px`;
        metric.section.dataset.scale = scale;
        for (const shot of metric.shots) {
          shot.style.width = `${shot.dataset.width * scale}px`;
          Object.assign(shot.parentElement.style, { width: `${metric.width * scale}px`, height: `${metric.height * scale}px` });
        }
      }

      render();
      updateDock();
      // The stories are drawn after the browser looks for the address's fragment, so a link to one story scrolls to it here.
      if (location.hash) {
        const linked = document.getElementById(decodeURIComponent(location.hash.slice(1)));
        if (linked) { linked.open = true; linked.scrollIntoView({ block: "start" }); }
      }
    </script>
  </body>
</html>
