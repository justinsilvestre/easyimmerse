packages:
  - apps/*
  - packages/*
  - fixtures
  - plugins/hello-js
# pnpm 12 refuses to install versions younger than 24 hours. This exemption let the
# opener plugin's 2.7.0 in on its release day, 2026-09-29. Delete the two lines below
# after 2026-09-30 and run `pnpm install` to confirm the lockfile still resolves.
minimumReleaseAgeExclude:
  - '@tauri-apps/plugin-opener@2.7.0'
# Storybook depends on esbuild, whose install script only verifies the platform binary that pnpm
# already installs as an optional dependency. Skipping the script is safe, and listing it here
# stops pnpm from warning about an ignored build script on every install.
allowBuilds:
  esbuild: false
# The WebdriverIO runner pulls in browser driver packages whose install scripts download drivers.
# Tauri tests drive the app through its embedded WebDriver server, so no browser driver is needed.
  edgedriver: false
  geckodriver: false
