name: Set up toolchain
description: Installs every tool through Mise and restores the Rust and pnpm caches. Assumes the repository is already checked out.

inputs:
  rust-cache:
    description: Whether to restore the Cargo cache.
    default: "true"

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v5
      with:
        cache: true
        install: true

    # Mise installs the toolchain through rustup but does not add the components and
    # targets that rust-toolchain.toml lists, so they are installed here.
    # On Windows runners the cached toolchain sometimes holds stale clippy files, which rustup
    # reports as a conflict, one file per attempt. Each conflicting file is removed and the
    # install tried again. Rustup names the file relative to the toolchain directory, with
    # backslashes, so the path is converted before it is joined.
    - name: Install the Rust components and cross-compilation targets
      shell: bash
      run: |
        attempts=0
        until rustup component add rustfmt clippy 2> "$RUNNER_TEMP/rustup-component-add.err"; do
          cat "$RUNNER_TEMP/rustup-component-add.err" >&2
          conflict=$(sed -n "s/.*detected conflict: '\(.*\)'/\1/p" "$RUNNER_TEMP/rustup-component-add.err")
          if [[ "$RUNNER_OS" != Windows || -z "$conflict" || $((attempts += 1)) -gt 5 ]]; then
            exit 1
          fi
          toolchain_dir=$(dirname "$(dirname "$(cygpath -u "$(rustup which rustc)")")")
          echo "Removing the conflicting file $conflict and retrying."
          rm -f "$toolchain_dir/${conflict//\\//}"
        done
        rustup target add wasm32-unknown-unknown wasm32-wasip2

    - uses: Swatinem/rust-cache@v2
      if: inputs.rust-cache == 'true'
      with:
        workspaces: |
          . -> target
          plugins -> target

    - name: Locate the pnpm store
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-

    - name: Install Node dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
