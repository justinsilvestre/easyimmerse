name: Set up toolchain
description: Installs every tool through Mise and restores the Rust and pnpm caches. Assumes the repository is already checked out.

inputs:
  rust-cache:
    description: Whether to restore the Cargo cache.
    default: "true"

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@v5
      with:
        cache: true
        install: true

    # Mise installs the toolchain through rustup but does not add the components and
    # targets that rust-toolchain.toml lists, so they are installed here.
    # On Windows runners this can fail with "detected conflict" on stale clippy pdb files.
    # Retry once after removing the conflicted file path that rustup reports.
    - name: Install the Rust components and cross-compilation targets
      shell: bash
      run: |
        if ! rustup component add rustfmt clippy 2> /tmp/rustup-component-add.err; then
          if [[ "$RUNNER_OS" != "Windows" ]]; then
            cat /tmp/rustup-component-add.err >&2
            exit 1
          fi

          conflict_path=$(sed -n "s/.*detected conflict: '\\(.*\\)'/\\1/p" /tmp/rustup-component-add.err)
          if [[ -z "$conflict_path" ]]; then
            cat /tmp/rustup-component-add.err >&2
            exit 1
          fi

          toolchain_bin_dir=$(dirname "$(rustup which rustc)")
          rm -f "$toolchain_bin_dir/${conflict_path//\\//}"
          rustup component add rustfmt clippy
        fi
        rustup target add wasm32-unknown-unknown wasm32-wasip2

    - uses: Swatinem/rust-cache@v2
      if: inputs.rust-cache == 'true'
      with:
        workspaces: |
          . -> target
          plugins -> target

    - name: Locate the pnpm store
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v4
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: pnpm-${{ runner.os }}-

    - name: Install Node dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
