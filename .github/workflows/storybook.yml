name: storybook

# Publishes a browsable Storybook for @easyimmerse/ui to GitHub Pages, one directory per
# branch on the gh-pages branch, and posts the link on the pull request.
# For a pull request it also screenshots every story on both sides of the change, publishes a
# report of the stories that differ under the preview's `changes/` directory, and posts a second
# comment with the counts. See scripts/storybook-diff/README.md.
# The Storybook build does not import the WebAssembly module (the only import of
# @easyimmerse/wasm it can reach is type-only), so the wasm build is not run here.

on:
  pull_request:
    # The closed event runs only the cleanup job, which removes the branch's preview.
    types: [opened, synchronize, reopened, closed]
    paths:
      - ".github/workflows/storybook.yml"
      - ".github/actions/**"
      - "mise.toml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/**"
      - "fixtures/**"
      - "scripts/storybook-diff/**"
  # A manual run publishes the preview of any branch without a pull request.
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/storybook.yml"
      - ".github/actions/**"
      - "mise.toml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "packages/**"
      - "fixtures/**"
      - "scripts/storybook-diff/**"

# The jobs that write to the gh-pages branch or the pull request ask for more below.
permissions:
  contents: read

# A newer push to the same branch cancels the run still going for the older one.
# The deploy job adds a second, repository-wide group below, because every run pushes to
# the same gh-pages branch and concurrent pushes would reject each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skips the other jobs when an earlier run passed on the same inputs.
  # The gate keys on file content only, so a branch whose files are identical to an
  # earlier passed run gets no fresh preview. That is accepted, except for two events
  # whose purpose is to publish: a manual run, and a reopened pull request, whose
  # preview the cleanup job removed when it was closed.
  # Skipping this job on the closed event also skips every job that needs it.
  gate:
    if: github.event.action != 'closed'
    runs-on: ubuntu-24.04
    outputs:
      passed: >-
        ${{ steps.find.outputs.passed == 'true'
            && github.event_name != 'workflow_dispatch'
            && github.event.action != 'reopened' }}
      key: ${{ steps.find.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/find-passed-run
        id: find

  build:
    needs: gate
    if: needs.gate.outputs.passed != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          # Nothing here runs Cargo, so the Cargo cache is not restored.
          rust-cache: "false"

      - name: Build Storybook
        run: pnpm --filter @easyimmerse/ui build-storybook

      # The artifact lets a reviewer download the preview even when GitHub Pages is not enabled.
      - uses: actions/upload-artifact@v4
        with:
          name: storybook
          path: packages/ui/storybook-static
          if-no-files-found: error

  # Screenshots every story on one side of the pull request: the commit it branched from, whose
  # Storybook this job builds itself, or the pull request's head, whose Storybook the build job made.
  capture:
    needs: [gate, build]
    if: needs.gate.outputs.passed != 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        side: [base, head]
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge base below needs the history of both branches.
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          rust-cache: "false"

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Find the commit the pull request branched from
        if: matrix.side == 'base'
        id: base
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: echo "commit=$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: matrix.side == 'base'
        with:
          ref: ${{ steps.base.outputs.commit }}
          path: base

      - name: Build the base commit's Storybook
        if: matrix.side == 'base'
        working-directory: base
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @easyimmerse/ui build-storybook

      - uses: actions/download-artifact@v4.1.3
        if: matrix.side == 'head'
        with:
          name: storybook
          path: packages/ui/storybook-static

      - name: Capture the stories
        env:
          STORYBOOK_DIR: ${{ matrix.side == 'base' && 'base/packages/ui/storybook-static' || 'packages/ui/storybook-static' }}
        run: node scripts/storybook-diff/capture.ts --storybook "$STORYBOOK_DIR" --out capture

      - uses: actions/upload-artifact@v4
        with:
          name: storybook-capture-${{ matrix.side }}
          path: capture
          retention-days: 7
          if-no-files-found: error

  # Compares the two captures into a report directory: the changes as JSON, the before, after,
  # and diff images of every changed story, and a page that shows them.
  compare:
    needs: [gate, capture]
    if: needs.gate.outputs.passed != 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    outputs:
      summary: ${{ steps.compare.outputs.summary }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
        with:
          rust-cache: "false"

      - uses: actions/download-artifact@v4.1.3
        with:
          name: storybook-capture-base
          path: capture-base

      - uses: actions/download-artifact@v4.1.3
        with:
          name: storybook-capture-head
          path: capture-head

      # The report is published under the preview's `changes/` directory, so the preview itself is one level up.
      - name: Compare the captures
        id: compare
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PULL_REQUEST_URL: ${{ github.event.pull_request.html_url }}
        run: |
          base="$(git merge-base "origin/$BASE_REF" "$HEAD_SHA")"
          summary="$(node scripts/storybook-diff/compare.ts --before capture-base --after capture-head --out changes --storybook-url ../ --base-label "$BASE_REF (${base:0:7})" --pull-request-url "$PULL_REQUEST_URL")"
          echo "summary=$summary" >> "$GITHUB_OUTPUT"
          echo "Storybook changes: $summary" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: storybook-changes
          path: changes
          if-no-files-found: error

  # This job does not run the setup action: it only moves files onto the gh-pages branch
  # with git and needs no toolchain, and it does not check out the source branch either.
  deploy:
    needs: [gate, build]
    # A pull request from a fork gets a read-only token, so its preview is skipped and
    # only the artifact from the build job remains.
    if: >-
      needs.gate.outputs.passed != 'true' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    # Only one job at a time may push to the gh-pages branch, across every branch and
    # pull request. GitHub keeps at most one job waiting in a group, so a third deploy that
    # arrives while one runs and one waits replaces the waiting one.
    concurrency:
      group: storybook-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4.1.3
        with:
          name: storybook
          path: packages/ui/storybook-static

      # A pull request's preview is named after its number, which cannot collide the way
      # two branch names can once their characters are replaced. A manual run has no
      # pull request, so its preview is named after the branch. The branch name goes
      # through an environment variable because it can contain characters that the
      # shell would interpret.
      - name: Derive the preview directory from the pull request or branch
        id: slug
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.event.repository.name }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            slug="pr-$PR_NUMBER"
          else
            slug="${HEAD_REF//[^A-Za-z0-9._-]/-}"
          fi
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "url=https://$OWNER.github.io/$REPOSITORY/storybook/$slug/" >> "$GITHUB_OUTPUT"

      - name: Link the preview from the run summary
        env:
          URL: ${{ steps.slug.outputs.url }}
        run: echo "Storybook preview at $URL" >> "$GITHUB_STEP_SUMMARY"

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: packages/ui/storybook-static
          destination_dir: storybook/${{ steps.slug.outputs.slug }}
          keep_files: true
          full_commit_message: "Deploy the Storybook preview for ${{ steps.slug.outputs.slug }}"

      # The header makes later runs update this comment instead of adding another one.
      - uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request'
        with:
          header: storybook-preview
          message: |
            ### Storybook preview

            ${{ steps.slug.outputs.url }}

            Built from ${{ github.event.pull_request.head.sha }}. The first deployment of a branch can take a minute or two to appear. If the link still returns a 404 after that, GitHub Pages must be enabled in the repository settings with the `gh-pages` branch and the root folder as its source.


  # Publishes the report beside the pull request's preview and posts its counts on the pull request.
  # Like deploy, it only moves files with git and runs no toolchain, and it shares deploy's
  # concurrency group because it pushes to the same branch.
  deploy-changes:
    needs: [gate, compare]
    if: >-
      needs.gate.outputs.passed != 'true' &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: storybook-gh-pages
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4.1.3
        with:
          name: storybook-changes
          path: changes

      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: changes
          destination_dir: storybook/pr-${{ github.event.pull_request.number }}/changes
          keep_files: true
          full_commit_message: "Deploy the Storybook changes for pr-${{ github.event.pull_request.number }}"

      - uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: storybook-changes
          message: |
            ### Storybook changes

            ${{ needs.compare.outputs.summary }}

            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/storybook/pr-${{ github.event.pull_request.number }}/changes/

            Before and after screenshots of the stories that differ from the commit this pull request branched from, in both themes at a phone and a desktop width. Built from ${{ github.event.pull_request.head.sha }}.

  # The screenshot jobs run only on pull requests, so a skipped one must not skip the record.
  # Deploy is still required to have passed, as it was before those jobs existed.
  record:
    needs: [gate, build, deploy, capture, compare, deploy-changes]
    if: >-
      ${{ !cancelled() && !failure() &&
          needs.gate.result == 'success' && needs.gate.outputs.passed != 'true' &&
          needs.deploy.result == 'success' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/record-passed-run
        with:
          key: ${{ needs.gate.outputs.key }}

  # Removes the closed pull request's preview from the gh-pages branch. This job does not
  # run the setup action: it only uses git and needs no toolchain. It is not gated and the
  # record job does not list it, because it changes nothing the gate hashes.
  # It does not share the deploy job's concurrency group: GitHub keeps only one job waiting
  # per group and cancels the rest, which could leave a directory behind for good.
  # Instead the push is retried after a deploy lands in between.
  cleanup:
    if: >-
      github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # The branch does not exist until the first deploy, so a pull request closed before
      # then has nothing to remove.
      - name: Check whether the gh-pages branch exists
        id: branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git ls-remote --exit-code --heads "https://x-access-token:$GITHUB_TOKEN@github.com/$GITHUB_REPOSITORY.git" refs/heads/gh-pages > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.branch.outputs.exists == 'true'
        with:
          ref: gh-pages

      - name: Remove the preview directory
        if: steps.branch.outputs.exists == 'true'
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          slug="pr-$PR_NUMBER"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin gh-pages
            git reset --quiet --hard origin/gh-pages
            git rm -r --quiet --ignore-unmatch "storybook/$slug"
            if git diff --cached --quiet; then
              echo "No preview directory for $slug."
              exit 0
            fi
            git commit --quiet -m "Remove the Storybook preview for $slug"
            if git push origin HEAD:gh-pages; then
              exit 0
            fi
            echo "Push attempt $attempt was rejected; another run pushed first. Retrying."
            sleep 10
          done
          exit 1
