name: ffmpeg-macos

# Builds an LGPL-only ffmpeg for macOS and publishes it as a release, because no
# first-party LGPL macOS build exists. scripts/fetch-ffmpeg/manifest.json pins the
# resulting assets by hash.

# Push a tag such as `ffmpeg-macos-8.1.2` on any branch to build that ffmpeg version, or
# `ffmpeg-macos-8.1.2-2` to build the same version again with a changed workflow.
# A tag push runs the workflow file at the tagged commit, so nothing needs to be on the
# default branch first. Manual dispatch only works once the file is on the default branch.
on:
  push:
    tags: ["ffmpeg-macos-*"]
  workflow_dispatch:
    inputs:
      ffmpeg-version:
        description: ffmpeg release to build, for example 8.1.2
        required: true

jobs:
  build:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Read the ffmpeg version and the release tag from the input or the tag
        id: version
        run: |
          v="${{ inputs.ffmpeg-version }}"
          tag="${v:+ffmpeg-macos-$v}"
          tag="${tag:-$GITHUB_REF_NAME}"
          suffixed="${tag#ffmpeg-macos-}"
          echo "version=${suffixed%%-*}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download and verify the source
        run: |
          set -eu
          v="${{ steps.version.outputs.version }}"
          curl -fsSLO "https://ffmpeg.org/releases/ffmpeg-$v.tar.xz"
          curl -fsSLO "https://ffmpeg.org/releases/ffmpeg-$v.tar.xz.asc"
          curl -fsSL https://ffmpeg.org/ffmpeg-devel.asc | gpg --import
          gpg --verify "ffmpeg-$v.tar.xz.asc" "ffmpeg-$v.tar.xz"
          shasum -a 256 "ffmpeg-$v.tar.xz" > source-sha256.txt
          tar xf "ffmpeg-$v.tar.xz"

      - name: Install the x86_64 assembler
        run: brew install nasm

      - name: Build for both architectures
        run: |
          set -eu
          v="${{ steps.version.outputs.version }}"
          # Autodetection is off so that the configure line names every library the binaries link,
          # which the licence-notice generator reads, and so that configure cannot pick up Homebrew's
          # X11 and XCB libraries on the arm64 runner, which a Mac without Homebrew lacks. The enabled
          # features are the hardware codecs and the system zlib and iconv.
          common="--disable-gpl --disable-nonfree --enable-version3 --disable-shared --enable-static \
                  --disable-doc --disable-debug --disable-ffplay --pkg-config-flags=--static \
                  --disable-autodetect --enable-videotoolbox --enable-audiotoolbox --enable-zlib --enable-iconv"
          mkdir -p out/aarch64-apple-darwin out/x86_64-apple-darwin
          (cd "ffmpeg-$v" && ./configure $common --prefix="$PWD/../install-arm64" && make -j"$(sysctl -n hw.ncpu)" && make install && make distclean)
          (cd "ffmpeg-$v" && ./configure $common --enable-cross-compile --arch=x86_64 --target-os=darwin \
              --cc="clang -arch x86_64" --prefix="$PWD/../install-x86_64" && make -j"$(sysctl -n hw.ncpu)" && make install)
          for bin in ffmpeg ffprobe; do
            cp "install-arm64/bin/$bin" "out/aarch64-apple-darwin/$bin"
            cp "install-x86_64/bin/$bin" "out/x86_64-apple-darwin/$bin"
          done
          strip out/*/ffmpeg out/*/ffprobe
          echo "$common" > out/configure-flags.txt

      - name: Check that the binaries link only system libraries
        run: |
          set -eu
          if otool -L out/*/ffmpeg out/*/ffprobe | grep -v ':$' | grep -Ev '^[[:space:]]+(/System/Library/|/usr/lib/)'; then
            echo "The binaries above link libraries that a Mac does not provide." >&2
            exit 1
          fi

      - name: Package
        run: |
          set -eu
          v="${{ steps.version.outputs.version }}"
          cd out
          for triple in aarch64-apple-darwin x86_64-apple-darwin; do
            tar -C "$triple" -cJf "ffmpeg-$v-$triple.tar.xz" ffmpeg ffprobe
          done
          {
            echo "# ffmpeg $v for macOS (LGPL)"
            echo
            echo "Source: https://ffmpeg.org/releases/ffmpeg-$v.tar.xz"
            echo "Source SHA-256: $(cut -d' ' -f1 ../source-sha256.txt)"
            echo
            echo "Configure flags:"
            echo '```'
            cat configure-flags.txt
            echo '```'
          } > BUILD.md
          shasum -a 256 *.tar.xz > SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          gh release create "${{ steps.version.outputs.tag }}" --title "ffmpeg $v for macOS (LGPL)" --notes-file out/BUILD.md \
            out/*.tar.xz out/SHA256SUMS out/BUILD.md
