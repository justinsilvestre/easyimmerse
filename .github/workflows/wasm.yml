name: wasm

on:
  pull_request:
    paths:
      - ".github/workflows/wasm.yml"
      - ".github/actions/**"
      - "mise.toml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "crates/**"
      - "packages/**"
      - "fixtures/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/wasm.yml"
      - ".github/actions/**"
      - "mise.toml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "crates/**"
      - "packages/**"
      - "fixtures/**"

# A newer push to the same branch cancels the run still going for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skips the other jobs when an earlier run passed on the same inputs.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      passed: ${{ steps.find.outputs.passed }}
      key: ${{ steps.find.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/find-passed-run
        id: find

  wasm:
    needs: gate
    if: needs.gate.outputs.passed != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build the WebAssembly module
        run: mise run wasm:build

      - name: Node tests against the fixtures
        run: pnpm --filter @easyimmerse/wasm test

      - name: Backend package tests
        run: pnpm --filter @easyimmerse/backend test

  record:
    needs: [gate, wasm]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/record-passed-run
        with:
          key: ${{ needs.gate.outputs.key }}
