name: native

on:
  pull_request:
    paths:
      - ".github/workflows/native.yml"
      - ".github/actions/**"
      - "mise.toml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/native/**"
      - "packages/**"
      - "crates/**"
      - "scripts/fetch-ffmpeg/**"
      - "fixtures/**"
  # A tag named native-ci-<job>-<stamp> runs that one job at the tagged commit, for one-off checks of a branch.
  push:
    branches: [main]
    tags: ["native-ci-*"]
    paths:
      - ".github/workflows/native.yml"
      - ".github/actions/**"
      - "mise.toml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/native/**"
      - "packages/**"
      - "crates/**"
      - "scripts/fetch-ffmpeg/**"
      - "fixtures/**"
  workflow_dispatch:

# A newer push to the same branch cancels the run still going for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skips the other jobs when an earlier run passed on the same inputs.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      passed: ${{ steps.find.outputs.passed }}
      key: ${{ steps.find.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/find-passed-run
        id: find

  desktop:
    needs: gate
    if: needs.gate.outputs.passed != 'true' && (github.ref_type != 'tag' || startsWith(github.ref_name, 'native-ci-desktop-'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Linux webview dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb

      - name: Fetch the ffmpeg sidecar
        run: mise run fetch-ffmpeg
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # The end-to-end tests need the global Tauri object, which the extra config file turns on.
      - name: Debug build without bundling
        run: pnpm --filter @easyimmerse/native exec tauri build --debug --no-bundle --config e2e/tauri.conf.json

      - name: Embedded server health check
        shell: bash
        run: |
          binary=target/debug/easyimmerse-native
          if [ "$RUNNER_OS" = "Windows" ]; then binary="$binary.exe"; fi
          if [ "$RUNNER_OS" = "Linux" ]; then xvfb-run --auto-servernum "$binary"; else "$binary"; fi
        env:
          EASYIMMERSE_SMOKE_TEST: "1"

      # The tests start the debug build, which serves WebDriver on a loopback port, so no browser driver is installed.
      - name: End-to-end tests through WebDriver
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run --auto-servernum pnpm --filter @easyimmerse/native e2e
          else
            pnpm --filter @easyimmerse/native e2e
          fi

  android:
    needs: gate
    if: needs.gate.outputs.passed != 'true' && (github.ref_type != 'tag' || startsWith(github.ref_name, 'native-ci-android-'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
      # The debug link for Android fills the runner's disk, and the NDK linker dies with a bus error instead of a clear message.
      # Removing unused preinstalled toolchains frees over ten gigabytes.
      # The last step reports what the build used.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/.ghcup /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/powershell \
            /usr/share/swift /usr/local/julia* /usr/local/share/chromium /opt/az
          df -h /
      - name: Rust Android target
        run: rustup target add aarch64-linux-android
      - name: Initialize the Android project
        run: pnpm --filter @easyimmerse/native exec tauri android init --ci --skip-targets-install
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      # Keeping only line tables in the debug information roughly halves the build's disk use.
      # Backtraces still show file and line numbers.
      - name: Debug APK
        run: pnpm --filter @easyimmerse/native exec tauri android build --debug --target aarch64 --apk --ci
        env:
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          CARGO_PROFILE_DEV_DEBUG: line-tables-only
      - name: Report build sizes
        if: always()
        run: |
          df -h /
          du -sh target apps/native/src-tauri/gen/android || true
          find apps/native/src-tauri/gen/android -name '*.apk' -exec ls -l {} + || true

  ios:
    needs: gate
    if: needs.gate.outputs.passed != 'true' && (github.ref_type != 'tag' || startsWith(github.ref_name, 'native-ci-ios-'))
    runs-on: macos-15
    env:
      # Only the newest Xcode versions on the runner keep their simulator runtime installed.
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Rust iOS simulator target
        run: rustup target add aarch64-apple-ios-sim
      - name: Initialize the Xcode project
        run: pnpm --filter @easyimmerse/native exec tauri ios init --ci --skip-targets-install
      # Xcode's build phase runs cargo in a rebuilt environment that keeps only PATH and
      # HOME, where the mise shim refuses mise.toml as untrusted. Putting rustup's own
      # cargo first keeps mise out of that phase; rust-toolchain.toml still picks the version.
      # The end-to-end tests need the global Tauri object, which the extra config file turns on.
      - name: Simulator build without signing
        run: PATH="$HOME/.cargo/bin:$PATH" pnpm --filter @easyimmerse/native exec tauri ios build --debug --target aarch64-sim --no-sign --ci --config e2e/tauri.conf.json
      # The cache holds the XCUITest driver and its WebDriverAgent build, which takes minutes.
      # It is saved at the end even when the tests fail, so a failing run still spares the next one that build.
      - uses: actions/cache/restore@v4
        id: appium-cache
        with:
          path: apps/native/.appium
          key: appium-ios-${{ runner.os }}-xcode16.4-${{ hashFiles('mise.toml', 'pnpm-lock.yaml') }}
          restore-keys: appium-ios-${{ runner.os }}-xcode16.4-
      - name: Install the Appium XCUITest driver
        run: mise run appium:install:ios
      - name: Simulator runtimes
        run: xcrun simctl list runtimes
      - name: End-to-end tests through Appium
        run: pnpm --filter @easyimmerse/native e2e:ios
      - name: Collect the simulator's screen, the app's log, and the Appium logs
        if: failure()
        run: |
          mkdir -p ios-diagnostics
          xcrun simctl io booted screenshot ios-diagnostics/screen.png || true
          xcrun simctl spawn booted log show --last 15m --predicate 'process == "easyImmerse"' --style compact > ios-diagnostics/app.log || true
          cp apps/native/e2e/logs/* ios-diagnostics/ || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-diagnostics
          path: ios-diagnostics
      - uses: actions/cache/save@v4
        if: always() && steps.appium-cache.outputs.cache-hit != 'true'
        with:
          path: apps/native/.appium
          key: ${{ steps.appium-cache.outputs.cache-primary-key }}

  record:
    needs: [gate, desktop, android, ios]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/record-passed-run
        with:
          key: ${{ needs.gate.outputs.key }}
