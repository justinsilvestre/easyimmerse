name: check

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"

# A newer push to the same branch cancels the run still going for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skips the other jobs when an earlier run passed on the same inputs.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      passed: ${{ steps.find.outputs.passed }}
      key: ${{ steps.find.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/find-passed-run
        id: find

  check:
    needs: gate
    if: needs.gate.outputs.passed != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Biome
        run: pnpm biome ci .

      - name: Regenerate types and OpenAPI document
        run: |
          mise run typegen
          mise run openapi

      - name: Fail when generated files are stale
        run: git diff --exit-code -- packages/types crates/api/openapi.json

      - name: Build the WebAssembly module the wasm package imports
        run: mise run wasm:build

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Build Storybook
        run: pnpm --filter @easyimmerse/ui build-storybook

      - name: Vitest
        run: pnpm -r --filter '!@easyimmerse/wasm' test

      - name: Script tests
        run: node --test 'scripts/**/*.test.ts'

      - name: Fail when the ffmpeg license notices are stale or a build breaks the license policy
        run: node scripts/ffmpeg-notices/index.ts --check

      - name: Fail when the crate license notices are stale
        run: node scripts/crate-notices/index.ts --check

  record:
    needs: [gate, check]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/record-passed-run
        with:
          key: ${{ needs.gate.outputs.key }}
