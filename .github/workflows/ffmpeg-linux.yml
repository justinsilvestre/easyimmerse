name: ffmpeg-linux

# Builds a minimal LGPL ffmpeg for Linux on x86-64 and ARM64 and publishes it as a release,
# because the first-party LGPL builds link libraries the licence policy rejects.
# scripts/fetch-ffmpeg/manifest.json pins the resulting assets by hash.

# Push a tag (or a branch) such as `ffmpeg-linux-8.1.3` on any branch to build that ffmpeg version, or
# `ffmpeg-linux-8.1.3-2` to build the same version again with a changed workflow.
# A tag push runs the workflow file at the tagged commit, so nothing needs to be on the
# default branch first. Manual dispatch only works once the file is on the default branch.
on:
  push:
    tags: ["ffmpeg-linux-*"]
    # A branch of the same form triggers the same build, for sessions that cannot push tags.
    # The release then creates the tag at the built commit.
    branches: ["ffmpeg-linux-*"]
  workflow_dispatch:
    inputs:
      ffmpeg-version:
        description: ffmpeg release to build, for example 8.1.3
        required: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-22.04
            triple: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            triple: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    # Debian 11 has glibc 2.31, so the binaries start on distributions from 2020 onwards.
    container: debian:bullseye
    steps:
      - name: Install the build tools
        run: |
          set -eu
          # Debian 11 reached the end of its support, so its packages now live on the archive.
          sed -i 's|http://deb.debian.org/debian-security|http://archive.debian.org/debian-security|; s|http://deb.debian.org/debian|http://archive.debian.org/debian|' /etc/apt/sources.list
          apt-get -o Acquire::Check-Valid-Until=false update
          apt-get install -y --no-install-recommends build-essential ca-certificates curl git gnupg \
            linux-libc-dev nasm ninja-build pkg-config python3-pip xz-utils zlib1g-dev
          pip3 install meson

      - uses: actions/checkout@v7

      - name: Read the ffmpeg version and the release tag from the input or the tag
        id: version
        run: |
          v="${{ inputs.ffmpeg-version }}"
          tag="${v:+ffmpeg-linux-$v}"
          tag="${tag:-$GITHUB_REF_NAME}"
          suffixed="${tag#ffmpeg-linux-}"
          echo "version=${suffixed%%-*}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Download and verify the source
        run: |
          set -eu
          v="${{ steps.version.outputs.version }}"
          curl -fsSLO "https://ffmpeg.org/releases/ffmpeg-$v.tar.xz"
          curl -fsSLO "https://ffmpeg.org/releases/ffmpeg-$v.tar.xz.asc"
          curl -fsSL https://ffmpeg.org/ffmpeg-devel.asc | gpg --import
          gpg --verify "ffmpeg-$v.tar.xz.asc" "ffmpeg-$v.tar.xz"
          sha256sum "ffmpeg-$v.tar.xz" > source-sha256.txt
          tar xf "ffmpeg-$v.tar.xz"

      - name: Build the dependencies and ffmpeg
        run: |
          set -eu
          sh scripts/ffmpeg-build/linux-deps.sh "$PWD/deps"
          sh scripts/ffmpeg-build/linux.sh "ffmpeg-${{ steps.version.outputs.version }}" deps "out/${{ matrix.triple }}"

      - name: Check that the binaries link only glibc
        run: sh scripts/ffmpeg-build/check-linux-links.sh out/${{ matrix.triple }}/ffmpeg out/${{ matrix.triple }}/ffprobe

      - name: Show the build
        run: |
          set -eu
          cd "out/${{ matrix.triple }}"
          ./ffmpeg -version
          ./ffmpeg -hide_banner -encoders
          ls -l ffmpeg ffprobe

      - name: Package
        run: |
          set -eu
          v="${{ steps.version.outputs.version }}"
          tar -C "out/${{ matrix.triple }}" -cJf "out/ffmpeg-$v-${{ matrix.triple }}.tar.xz" ffmpeg ffprobe
          mv "out/${{ matrix.triple }}/configure-flags.txt" out/
          cp source-sha256.txt out/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.triple }}
          path: |
            out/*.tar.xz
            out/configure-flags.txt
            out/source-sha256.txt
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Read the ffmpeg version and the release tag from the input or the tag
        id: version
        run: |
          v="${{ inputs.ffmpeg-version }}"
          tag="${v:+ffmpeg-linux-$v}"
          tag="${tag:-$GITHUB_REF_NAME}"
          suffixed="${tag#ffmpeg-linux-}"
          echo "version=${suffixed%%-*}" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Write the build notes and checksums
        run: |
          set -eu
          v="${{ steps.version.outputs.version }}"
          cd out
          {
            echo "# ffmpeg $v for Linux (LGPL)"
            echo
            echo "Source: https://ffmpeg.org/releases/ffmpeg-$v.tar.xz"
            echo "Source SHA-256: $(cut -d' ' -f1 source-sha256.txt)"
            echo
            echo "Built on Debian 11 (glibc 2.31) with libva, libdrm and the Nvidia encoder headers linked statically."
            echo
            echo "Configure flags:"
            echo '```'
            cat configure-flags.txt
            echo '```'
          } > BUILD.md
          sha256sum *.tar.xz > SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.version.outputs.version }}"
          gh release create "${{ steps.version.outputs.tag }}" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --title "ffmpeg $v for Linux (LGPL)" \
            --notes-file out/BUILD.md out/*.tar.xz out/SHA256SUMS out/BUILD.md
