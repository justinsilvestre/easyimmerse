name: rust

on:
  pull_request:
    paths:
      - ".github/workflows/rust.yml"
      - ".github/actions/**"
      - "mise.toml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "crates/**"
      - "apps/server/**"
      - "fixtures/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/rust.yml"
      - ".github/actions/**"
      - "mise.toml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "crates/**"
      - "apps/server/**"
      - "fixtures/**"

# A newer push to the same branch cancels the run still going for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Format
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path plugins/Cargo.toml --all --check

      - name: Clippy
        run: cargo clippy --workspace --exclude easyimmerse-native --all-targets -- -D warnings

      # The plugin host's tests load plugins built by `mise run plugins:build`; the plugins
      # workflow builds those and runs that crate's tests on every platform.
      - name: Test
        run: cargo test --workspace --exclude easyimmerse-native --exclude easyimmerse-plugins
