name: rust

on:
  pull_request:
    paths:
      - ".github/workflows/rust.yml"
      - ".github/actions/**"
      - "mise.toml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "crates/**"
      - "apps/server/**"
      - "fixtures/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/rust.yml"
      - ".github/actions/**"
      - "mise.toml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "crates/**"
      - "apps/server/**"
      - "fixtures/**"

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Format
        run: |
          cargo fmt --all --check
          cargo fmt --manifest-path plugins/Cargo.toml --all --check

      - name: Clippy
        run: cargo clippy --workspace --exclude easyimmerse-native --all-targets -- -D warnings

      - name: Test
        run: cargo test
