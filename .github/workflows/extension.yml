name: extension

on:
  pull_request:
    paths:
      - ".github/workflows/extension.yml"
      - ".github/actions/**"
      - "mise.toml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/extension/**"
      - "packages/**"
      - "crates/**"
      - "apps/server/**"
      - "fixtures/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/extension.yml"
      - ".github/actions/**"
      - "mise.toml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "apps/extension/**"
      - "packages/**"
      - "crates/**"
      - "apps/server/**"
      - "fixtures/**"

# A newer push to the same branch cancels the run still going for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skips the other jobs when an earlier run passed on the same inputs.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      passed: ${{ steps.find.outputs.passed }}
      key: ${{ steps.find.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/find-passed-run
        id: find

  extension:
    needs: gate
    if: needs.gate.outputs.passed != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build the server and the WebAssembly module
        run: |
          cargo build -p easyimmerse-server
          mise run wasm:build

      # Zipping builds the extension first, so the zips come from the same builds the later steps test.
      - name: Chrome build and zip
        run: pnpm --filter @easyimmerse/extension zip

      - name: Firefox build and zip
        run: pnpm --filter @easyimmerse/extension zip:firefox

      - name: Upload the zips
        uses: actions/upload-artifact@v4
        with:
          name: easyimmerse-extension
          path: |
            apps/extension/.output/*.zip
            !apps/extension/.output/*-sources.zip
          if-no-files-found: error
          retention-days: 14

      - name: Firefox manifest lint
        run: pnpm --filter @easyimmerse/extension lint:firefox

      - name: Read the Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @easyimmerse/extension exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: pnpm --filter @easyimmerse/extension exec playwright install --with-deps chromium

      - name: Playwright smoke test
        run: xvfb-run --auto-servernum pnpm --filter @easyimmerse/extension e2e

  record:
    needs: [gate, extension]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/record-passed-run
        with:
          key: ${{ needs.gate.outputs.key }}
