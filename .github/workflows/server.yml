name: server

on:
  pull_request:
    paths:
      - ".github/workflows/server.yml"
      - ".github/actions/**"
      - "mise.toml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "crates/**"
      - "apps/server/**"
      - "apps/web/**"
      - "packages/**"
      - "fixtures/**"
  # A tag named server-ci-<job>-<stamp> runs that one job at the tagged commit, for one-off checks of a branch.
  push:
    branches: [main]
    tags: ["server-ci-*"]
    paths:
      - ".github/workflows/server.yml"
      - ".github/actions/**"
      - "mise.toml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "crates/**"
      - "apps/server/**"
      - "apps/web/**"
      - "packages/**"
      - "fixtures/**"

# A newer push to the same branch cancels the run still going for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skips the other jobs when an earlier run passed on the same inputs.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      passed: ${{ steps.find.outputs.passed }}
      key: ${{ steps.find.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/find-passed-run
        id: find

  server:
    needs: gate
    if: needs.gate.outputs.passed != 'true' && (github.ref_type != 'tag' || startsWith(github.ref_name, 'server-ci-server-'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build
        run: cargo build -p easyimmerse-server --release

      - name: Start and probe
        run: |
          target/release/easyimmerse-server serve --token ci --seed-placeholders &
          for _ in $(seq 1 50); do
            curl -fsS http://127.0.0.1:8787/health && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:8787/health | grep -q '"status":"ok"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/projects)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: evil.test' http://127.0.0.1:8787/health)" = 421
          projects="$(curl -fsS -H 'Authorization: Bearer ci' http://127.0.0.1:8787/projects)"
          echo "$projects" | grep -q 'Spanish practice'
          echo "$projects" | grep -q 'Japanese drama'
          kill %1

      # The plugin route tests load plugins built by `mise run plugins:build`, so the plugins workflow runs them.
      - name: API integration tests
        run: |
          cargo test -p easyimmerse-api -p easyimmerse-storage -- --skip plugin_routes::

  # Builds the server binary together with the web app it serves, for downloading and testing.
  # The job is slow, so it skips pull requests and runs once changes reach main, or on a server-ci-bundle tag.
  bundle:
    needs: gate
    if: needs.gate.outputs.passed != 'true' && github.event_name != 'pull_request' && (github.ref_type != 'tag' || startsWith(github.ref_name, 'server-ci-bundle-'))
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build the WebAssembly module
        run: mise run wasm:build

      - name: Build the web app
        run: pnpm --filter @easyimmerse/web build

      - name: Build the release server
        run: cargo build --release -p easyimmerse-server

      # The server looks for the web app in a web directory beside its binary.
      - name: Assemble the server directory
        shell: bash
        run: |
          mkdir easyimmerse-server
          cp target/release/easyimmerse-server* easyimmerse-server/
          rm -f easyimmerse-server/*.d easyimmerse-server/*.pdb
          cp -R apps/web/dist easyimmerse-server/web
          test -f easyimmerse-server/web/index.html

      - name: Upload the server
        uses: actions/upload-artifact@v4
        with:
          name: easyimmerse-server-${{ matrix.os }}
          path: easyimmerse-server
          if-no-files-found: error
          retention-days: 14

  # Runs although bundle is skipped on pull requests.
  # A pass recorded by a pull request cannot skip bundle on main, because a run on main cannot read caches saved by a pull request.
  record:
    needs: [gate, server, bundle]
    if: ${{ !cancelled() && !failure() && needs.gate.outputs.passed != 'true' && github.ref_type != 'tag' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/record-passed-run
        with:
          key: ${{ needs.gate.outputs.key }}
