name: plugins

on:
  pull_request:
  push:
    branches: [main]

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build the example plugins
        run: mise run plugins:build

      - name: Host tests
        run: cargo test -p easyimmerse-plugins

  interpreter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build the example plugins
        run: mise run plugins:build

      - name: Host tests under the Pulley interpreter
        run: cargo test -p easyimmerse-plugins --features interpreter
        env:
          EASYIMMERSE_PLUGIN_EXECUTION: interpreter
