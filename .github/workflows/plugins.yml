name: plugins

on:
  pull_request:
    paths:
      - ".github/workflows/plugins.yml"
      - ".github/actions/**"
      - "mise.toml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "plugins/**"
      - "crates/**"
      - "fixtures/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/plugins.yml"
      - ".github/actions/**"
      - "mise.toml"
      - "rust-toolchain.toml"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".cargo/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "plugins/**"
      - "crates/**"
      - "fixtures/**"

# A newer push to the same branch cancels the run still going for the older one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Skips the other jobs when an earlier run passed on the same inputs.
  gate:
    runs-on: ubuntu-24.04
    outputs:
      passed: ${{ steps.find.outputs.passed }}
      key: ${{ steps.find.outputs.key }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/find-passed-run
        id: find

  host:
    needs: gate
    if: needs.gate.outputs.passed != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Format
        run: cargo fmt --manifest-path plugins/Cargo.toml --all --check

      - name: Build the example plugins
        run: mise run plugins:build

      - name: Host tests
        run: cargo test -p easyimmerse-plugins

  interpreter:
    needs: gate
    if: needs.gate.outputs.passed != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: Build the example plugins
        run: mise run plugins:build

      - name: Host tests under the Pulley interpreter
        run: cargo test -p easyimmerse-plugins --features interpreter
        env:
          EASYIMMERSE_PLUGIN_EXECUTION: interpreter

  # Proves the host crate cross-compiles for the mobile targets. Nothing runs: the
  # iOS target cannot run tests on the runner, and the Android check only needs the NDK
  # compiler for the C dependencies' build scripts.
  mobile:
    needs: gate
    if: needs.gate.outputs.passed != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-ios
          - os: ubuntu-24.04
            target: aarch64-linux-android
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - uses: nttld/setup-ndk@v1
        if: matrix.target == 'aarch64-linux-android'
        id: ndk
        with:
          ndk-version: r28c
      - name: Point cargo at the NDK compiler
        if: matrix.target == 'aarch64-linux-android'
        run: |
          toolchain="${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CC_aarch64_linux_android=$toolchain/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$toolchain/llvm-ar"
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$toolchain/aarch64-linux-android24-clang"
          } >> "$GITHUB_ENV"
      - name: Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Check the host with the interpreter
        run: cargo check -p easyimmerse-plugins --features interpreter --target ${{ matrix.target }}

  record:
    needs: [gate, host, interpreter, mobile]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/actions
      - uses: ./.github/actions/record-passed-run
        with:
          key: ${{ needs.gate.outputs.key }}
