# The example plugins are a separate workspace so they can be built for
# `wasm32-wasip2` without pulling the host crates into the same target.
[workspace]
resolver = "3"
members = ["hello-rust", "hello-loop", "fixture-media-source"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"

[workspace.dependencies]
wit-bindgen = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
strip = true
