<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Storybook changes</title>
    <script>
      // Sets the theme before the first paint, so a dark page does not flash light.
      function savedTheme() {
        try { return localStorage.getItem("theme"); } catch { return null; }
      }
      document.documentElement.dataset.theme =
        savedTheme() ?? (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    </script>
    <style>
      :root {
        color-scheme: light;
        --bg: #fff;
        --fg: #1a1a1a;
        --muted: #666;
        --line: #ddd;
        --card: #f6f6f6;
        --accent: #2563eb;
        --changed: #b45309;
        --added: #15803d;
        --removed: #b91c1c;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #141414;
        --fg: #eee;
        --muted: #999;
        --line: #333;
        --card: #1f1f1f;
        --accent: #60a5fa;
        --changed: #f59e0b;
        --added: #4ade80;
        --removed: #f87171;
      }
      body {
        margin: 0;
        padding: 0 16px 16px;
        font: 14px/1.5 system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      h1 {
        font-size: 20px;
        margin: 0 0 4px;
        padding-top: 16px;
      }
      .summary {
        color: var(--muted);
        margin: 0 0 8px;
      }
      .toolbar {
        position: sticky;
        top: 0;
        z-index: 2;
        padding: 8px 0;
        margin-bottom: 8px;
        background: var(--bg);
        display: flex;
        gap: 8px 16px;
        flex-wrap: wrap;
        justify-content: space-between;
      }
      .toolbar > div {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
      }
      .toolbar button {
        font: inherit;
        padding: 4px 10px;
        border: 1px solid var(--line);
        border-radius: 999px;
        background: var(--card);
        color: var(--fg);
        cursor: pointer;
      }
      .toolbar button[aria-pressed="true"] {
        border-color: var(--accent);
        color: var(--accent);
      }
      .segmented {
        display: flex;
        margin: 0;
        padding: 0;
        border: 0;
      }
      .segmented button:first-child { border-radius: 999px 0 0 999px; }
      .segmented button:last-child { border-radius: 0 999px 999px 0; margin-left: -1px; }
      .segmented button[aria-pressed="true"] { position: relative; }
      details.story {
        border: 1px solid var(--line);
        border-radius: 8px;
        margin-bottom: 16px;
        background: var(--card);
        scroll-margin-top: calc(var(--toolbar-height, 0px) + 8px);
      }
      details.story > summary {
        position: sticky;
        top: var(--toolbar-height, 0px);
        z-index: 1;
        padding: 8px 12px;
        border-radius: 8px;
        background: var(--card);
        cursor: pointer;
        list-style: none;
        display: flex;
        gap: 4px 8px;
        align-items: baseline;
        flex-wrap: wrap;
      }
      details.story[open] > summary {
        border-radius: 8px 8px 0 0;
        border-bottom: 1px solid var(--line);
      }
      details.story > summary::-webkit-details-marker { display: none; }
      details.story > summary::before {
        content: "▸";
        width: 1em;
        color: var(--muted);
      }
      details.story[open] > summary::before { content: "▾"; }
      .title {
        font-size: 15px;
        font-weight: 600;
      }
      .kind {
        font-size: 12px;
        padding: 1px 8px;
        border-radius: 999px;
        border: 1px solid currentColor;
      }
      .kind-changed { color: var(--changed); }
      .kind-added { color: var(--added); }
      .kind-removed, .kind-errored { color: var(--removed); }
      .meta {
        color: var(--muted);
        font-size: 12px;
      }
      .meta a { color: var(--accent); }
      .story-body { padding: 0 12px 12px; }
      .full-size { margin-left: 6px; color: var(--accent); }
      .variants {
        display: flex;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 12px 16px;
      }
      .variant {
        margin-top: 12px;
        min-width: 0;
        max-width: 100%;
      }
      .variant h3 {
        font-size: 13px;
        margin: 0 0 6px;
        color: var(--muted);
        font-weight: normal;
        display: flex;
        gap: 0 12px;
        flex-wrap: wrap;
      }
      .variant label { cursor: pointer; }
      .resized { color: var(--changed); }
      .images {
        display: flex;
        align-items: flex-start;
        gap: 16px;
      }
      figure {
        flex: 0 1 auto;
        margin: 0;
        min-width: 0;
      }
      figcaption {
        font-size: 12px;
        color: var(--muted);
        margin-bottom: 4px;
      }
      .frame {
        position: relative;
        display: inline-block;
        max-width: 100%;
        overflow: hidden;
        vertical-align: top;
        border: 1px solid var(--line);
        background: repeating-linear-gradient(-45deg, var(--line) 0 1px, transparent 1px 6px);
      }
      .frame .overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        background: none;
        opacity: 0.8;
        pointer-events: none;
        visibility: hidden;
      }
      :is(.variant:has(.highlight:checked), .flash) .overlay { visibility: visible; }
      figure img {
        display: block;
        max-width: 100%;
        width: auto;
        height: auto;
        background: #fff;
        cursor: pointer;
      }
      pre.error {
        white-space: pre-wrap;
        font-size: 12px;
        color: var(--removed);
        margin: 12px 0 0;
      }
      .empty { color: var(--muted); }
      .note {
        color: var(--muted);
        margin: 12px 0 0;
      }
    </style>
  </head>
  <body>
    <h1>Storybook changes</h1>
    <p class="summary" id="summary"></p>
    <header class="toolbar" id="toolbar">
      <div id="filters"></div>
      <div>
        <button type="button" id="collapse-all">Collapse all</button>
        <button type="button" id="expand-all">Expand all</button>
        <fieldset class="segmented" id="themes" aria-label="Theme"></fieldset>
      </div>
    </header>
    <main id="changes"></main>
    <script id="report" type="application/json">"__REPORT__"</script>
    <script>
      const report = JSON.parse(document.getElementById("report").textContent);
      const kinds = ["changed", "added", "removed", "errored"];
      const state = { kind: "all", collapsed: new Set() };
      const theme = () => document.documentElement.dataset.theme;

      const count = (kind) => report.changes.filter((change) => change.kind === kind).length;
      document.getElementById("summary").textContent =
        kinds.map((kind) => `${count(kind)} ${kind}`).join(", ") +
        ` of ${report.storyCount} stories` +
        (report.baseLabel ? ` compared with ${report.baseLabel}` : "") +
        ". The page theme picks which screenshots are shown. Click a screenshot to flip between before and after.";

      const filters = document.getElementById("filters");
      for (const kind of ["all", ...kinds]) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = kind === "all" ? `All (${report.changes.length})` : `${kind} (${count(kind)})`;
        button.addEventListener("click", () => { state.kind = kind; render(); });
        button.dataset.kind = kind;
        filters.append(button);
      }

      const themes = document.getElementById("themes");
      for (const name of ["light", "dark"]) {
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = name === "light" ? "Light" : "Dark";
        button.dataset.theme = name;
        button.addEventListener("click", () => switchTheme(name));
        themes.append(button);
      }

      function switchTheme(name) {
        document.documentElement.dataset.theme = name;
        try { localStorage.setItem("theme", name); } catch {}
        render();
      }

      document.getElementById("collapse-all").addEventListener("click", () => {
        for (const story of document.querySelectorAll("details.story")) story.open = false;
      });
      document.getElementById("expand-all").addEventListener("click", () => {
        for (const story of document.querySelectorAll("details.story")) story.open = true;
      });

      new ResizeObserver(([entry]) => {
        document.documentElement.style.setProperty("--toolbar-height", `${entry.borderBoxSize[0].blockSize}px`);
      }).observe(document.getElementById("toolbar"));

      function storyLink(change) {
        if (!report.storybookUrl) return change.importPath;
        const url = new URL(report.storybookUrl, location.href);
        url.search = `?path=/story/${change.id}`;
        return `<a href="${url.href}" target="_blank">${change.importPath}</a>`;
      }

      const fileNameOf = (variant) => `${variant.theme}-${variant.viewport.name}.png`;
      const themeFileNames = (name) => report.variants.filter((variant) => variant.theme === name).map(fileNameOf);
      const pixelsOf = (change) =>
        themeFileNames(theme()).reduce((sum, fileName) => sum + (change.changedVariants[fileName] ?? 0), 0);

      function image(change, side, fileName) {
        const src = `${change.id}/${side}-${fileName}`;
        const other = side === "before" ? "after" : "before";
        const hasOther = change.kind === "changed";
        const overlay = change.changedVariants[fileName]
          ? `<img class="overlay" src="${change.id}/diff-${fileName}" alt="" loading="lazy" />` : "";
        return `<figure data-side="${side}"><figcaption><span>${side === "before" ? "Before" : "After"}</span><a class="full-size" href="${src}" target="_blank">full size</a></figcaption>
          <div class="frame"><img src="${src}" alt="${side}" loading="lazy" ${hasOther ? `data-flip="${change.id}/${other}-${fileName}"` : ""} />${overlay}</div></figure>`;
      }

      function variantSection(change, fileName) {
        const pixels = change.changedVariants[fileName];
        const label = report.variants.find((variant) => fileNameOf(variant) === fileName).viewport.name;
        const sides = change.kind === "added" ? ["after"] : change.kind === "changed" ? ["before", "after"] : ["before"];
        const highlight = pixels ? `<label><input type="checkbox" class="highlight" /> Highlight ${pixels} changed px</label>` : "";
        return `<section class="variant"><h3><span>${label}</span>${highlight}<span class="resized"></span></h3>
          <div class="images">${sides.map((side) => image(change, side, fileName)).join("")}</div></section>`;
      }

      /** A changed story shows only the variants that differ in the page's theme; every other kind shows all of the theme's variants. */
      function variantsOf(change) {
        const fileNames = themeFileNames(theme());
        const changed = fileNames.filter((fileName) => fileName in change.changedVariants);
        const anyChanged = Object.keys(change.changedVariants).length > 0;
        return change.kind === "changed" && anyChanged ? changed : fileNames;
      }

      function variantsBody(change) {
        const fileNames = variantsOf(change);
        if (fileNames.length > 0) return `<div class="variants">${fileNames.map((fileName) => variantSection(change, fileName)).join("")}</div>`;
        const otherTheme = theme() === "light" ? "dark" : "light";
        return `<p class="note">Nothing changed in the ${theme()} theme. Switch to the ${otherTheme} theme to see what did.</p>`;
      }

      function card(change) {
        const errors = [change.errorBefore && `Before: ${change.errorBefore}`, change.error && `After: ${change.error}`].filter(Boolean);
        return `<details class="story" data-id="${change.id}" ${state.collapsed.has(change.id) ? "" : "open"}>
          <summary><span class="kind kind-${change.kind}">${change.kind}</span><span class="title">${change.title} / ${change.name}</span><span class="meta">${storyLink(change)}</span></summary>
          <div class="story-body">
            ${errors.length ? `<pre class="error">${errors.join("\n")}</pre>` : ""}
            ${variantsBody(change)}
          </div>
        </details>`;
      }

      function render() {
        for (const button of filters.children) button.setAttribute("aria-pressed", String(button.dataset.kind === state.kind));
        for (const button of themes.children) button.setAttribute("aria-pressed", String(button.dataset.theme === theme()));
        const shown = report.changes
          .filter((change) => state.kind === "all" || change.kind === state.kind)
          .sort((a, b) => pixelsOf(b) - pixelsOf(a));
        document.getElementById("changes").innerHTML = shown.length
          ? shown.map(card).join("")
          : `<p class="empty">No stories ${state.kind === "all" ? "changed" : state.kind}.</p>`;
      }
      render();

      // Keeps a collapsed story's header in view, since collapsing a long story while its header is stuck to the top would scroll it out of sight.
      document.addEventListener("toggle", (event) => {
        const story = event.target;
        if (!story.matches?.("details.story")) return;
        if (story.open) {
          state.collapsed.delete(story.dataset.id);
          layoutStory(story);
        } else {
          state.collapsed.add(story.dataset.id);
          const toolbarHeight = document.getElementById("toolbar").offsetHeight;
          if (story.getBoundingClientRect().top < toolbarHeight) story.scrollIntoView({ block: "start" });
        }
      }, true);

      document.addEventListener("click", (event) => {
        const img = event.target.closest("img[data-flip]");
        if (!img) return;
        const flipped = img.dataset.flip;
        img.dataset.flip = img.getAttribute("src");
        img.src = flipped;
        img.parentElement.classList.add("flash");
        setTimeout(() => img.parentElement.classList.remove("flash"), 200);
        const caption = img.closest("figure").querySelector("figcaption span");
        caption.textContent = flipped.includes("/before-") ? "Before" : "After";
      });

      // Records each screenshot's own size on first load, before any flip, to flag stories that grew or shrank.
      document.addEventListener("load", (event) => {
        if (!event.target.matches?.(".frame img:not(.overlay)")) return;
        const img = event.target;
        const section = img.closest(".variant");
        if (!img.dataset.size) {
          img.dataset.size = `${img.naturalWidth}×${img.naturalHeight}`;
          img.dataset.width = img.naturalWidth;
          img.dataset.height = img.naturalHeight;
          const [before, after] = ["before", "after"].map((side) => section.querySelector(`[data-side="${side}"] .frame img`)?.dataset.size);
          if (before && after && before !== after) section.querySelector(".resized").textContent = `Size changed: ${before} → ${after}`;
        }
        layoutStory(img.closest("details.story"));
      }, true);

      let resizeFrame = 0;
      addEventListener("resize", () => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(() => document.querySelectorAll("details.story[open]").forEach(layoutStory));
      });

      const gap = 16;
      const border = 2;
      const minVariantWidth = 180;
      /** Variants share a row only when none is shown at less than this scale, or than its scale on a row of its own if that is smaller. */
      const minSharedScale = 0.5;

      // Sizes every screenshot of a story once all of them have loaded.
      // Within a variant, both sides share one scale and one frame, sized to the larger of the two, so that flipping moves nothing,
      // and the diff image has that same size, so the highlight fills the frame.
      // Variants are packed into rows, such as phone beside desktop, when they fit side by side at a common scale cap without shrinking too far.
      function layoutStory(story) {
        const room = story.querySelector(".variants")?.clientWidth;
        if (!room) return;
        const metrics = [...story.querySelectorAll(".variant")].map((section) => measureVariant(section, room));
        if (metrics.some((metric) => !metric)) return;
        for (const row of packRows(metrics, room)) {
          const cap = largestCap(row, room);
          for (const metric of row) applyScale(metric, Math.min(metric.fullScale, cap));
        }
      }

      function measureVariant(section, room) {
        const shots = [...section.querySelectorAll(".frame img:not(.overlay)")];
        if (!shots.every((shot) => shot.dataset.width)) return null;
        const width = Math.max(...shots.map((shot) => Number(shot.dataset.width)));
        const height = Math.max(...shots.map((shot) => Number(shot.dataset.height)));
        const fixed = shots.length * border + gap * (shots.length - 1);
        const fullScale = Math.min(1, (room - fixed) / (shots.length * width), (innerHeight * 0.8) / height);
        return { section, shots, width, height, fixed, fullScale };
      }

      const variantWidth = (metric, cap) =>
        Math.max(minVariantWidth, metric.fixed + metric.shots.length * metric.width * Math.min(metric.fullScale, cap));

      const rowFits = (row, cap, room) =>
        row.reduce((sum, metric) => sum + variantWidth(metric, cap), gap * (row.length - 1)) <= room;

      function largestCap(row, room) {
        if (rowFits(row, 1, room)) return 1;
        let low = 0;
        let high = 1;
        for (let step = 0; step < 20; step++) {
          const middle = (low + high) / 2;
          if (rowFits(row, middle, room)) low = middle;
          else high = middle;
        }
        return low;
      }

      function packRows(metrics, room) {
        const rows = [];
        for (const metric of metrics) {
          const row = rows.at(-1);
          const candidate = row && [...row, metric];
          const floor = candidate && Math.min(minSharedScale, Math.max(...candidate.map((item) => item.fullScale)));
          if (candidate && largestCap(candidate, room) >= floor) row.push(metric);
          else rows.push([metric]);
        }
        return rows;
      }

      function applyScale(metric, scale) {
        metric.section.style.width = `${variantWidth(metric, scale)}px`;
        for (const shot of metric.shots) {
          shot.style.width = `${shot.naturalWidth * scale}px`;
          Object.assign(shot.parentElement.style, { width: `${metric.width * scale}px`, height: `${metric.height * scale}px` });
        }
      }
    </script>
  </body>
</html>
