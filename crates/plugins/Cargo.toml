[package]
name = "easyimmerse-plugins"
description = "The wasmtime host that loads easyimmerse plugins and grants them capabilities"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = []
interpreter = ["wasmtime/pulley"]

[dependencies]
easyimmerse-core = { workspace = true }
easyimmerse-plugin-api = { workspace = true }
fs4 = { workspace = true }
hex = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
ureq = { workspace = true }
wasmtime = { workspace = true, features = ["parallel-compilation"] }
wasmtime-wasi = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tiny_http = { workspace = true }
# Lets the tests load components written in the WebAssembly text format.
wasmtime = { workspace = true, features = ["wat"] }
